<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#060608">
  <title>A Secret Awaits ✨ — Akshaya's 25th Birthday</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🌌</text></svg>">
  <link rel="stylesheet" href="css/fullscreen.css">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      width: 100%;
      height: 100%;
      height: 100dvh;
      background-color: #060608;
      overflow: hidden;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    #app-frame {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      height: 100dvh;
      border: none;
      outline: none;
      display: block;
      z-index: 1;
      background-color: #060608;
    }
  </style>
</head>
<body>

  <!-- Master Birthday Background Audio Element -->
  <audio id="master-bg-audio" loop preload="auto">
    <source src="audio/bday_music.mp3" type="audio/mpeg">
    <source src="bday_music.mp3" type="audio/mpeg">
  </audio>

  <!-- Seamless Continuous Fullscreen Presentation Shell -->
  <iframe
    id="app-frame"
    src="lock.html"
    allow="fullscreen; autoplay; camera; microphone"
    allowfullscreen="true"
    webkitallowfullscreen="true"
    mozallowfullscreen="true"
    title="Akshaya Celebration Universe">
  </iframe>

  <!-- Master Fullscreen Controller Script -->
  <script src="js/fullscreen.js"></script>

  <script>
    const appFrame = document.getElementById('app-frame');
    const masterAudio = document.getElementById('master-bg-audio');

    // Master Continuous Audio Controller across all pages
    window.CelebrationMusicMaster = {
      audio: masterAudio,
      isPlaying: false,
      play() {
        if (!masterAudio) return;
        sessionStorage.setItem('celebration_music_enabled', 'true');
        sessionStorage.setItem('celebration_unlocked', 'true');
        masterAudio.muted = false;
        masterAudio.play().then(() => {
          this.isPlaying = true;
          this.notifyChildFrames();
        }).catch(e => {
          console.log('Audio autoplay awaiting interaction:', e);
        });
      },
      pause() {
        if (!masterAudio) return;
        masterAudio.pause();
        this.isPlaying = false;
        this.notifyChildFrames();
      },
      toggle() {
        if (this.isPlaying) {
          this.pause();
        } else {
          this.play();
        }
      },
      notifyChildFrames() {
        try {
          if (appFrame && appFrame.contentWindow && appFrame.contentWindow.CelebrationMusic) {
            appFrame.contentWindow.CelebrationMusic.updateUi();
          }
        } catch (e) {}
      }
    };

    if (masterAudio) {
      masterAudio.addEventListener('play', () => {
        window.CelebrationMusicMaster.isPlaying = true;
        window.CelebrationMusicMaster.notifyChildFrames();
      });
      masterAudio.addEventListener('pause', () => {
        window.CelebrationMusicMaster.isPlaying = false;
        window.CelebrationMusicMaster.notifyChildFrames();
      });
    }

    // Handle deep-link query parameter e.g. /?page=page1.html
    try {
      const urlParams = new URLSearchParams(window.location.search);
      const targetPage = urlParams.get('page');
      if (targetPage && targetPage !== 'index.html') {
        appFrame.src = targetPage;
      }
    } catch (e) {}

    appFrame.addEventListener('load', () => {
      try {
        const childDoc = appFrame.contentDocument || appFrame.contentWindow.document;
        if (childDoc && childDoc.title) {
          document.title = childDoc.title;
        }

        const childPath = appFrame.contentWindow.location.pathname;
        const pageFile = childPath.split('/').pop() || 'lock.html';
        const cleanSlug = pageFile.replace('.html', '');
        const newPath = (cleanSlug === 'lock' || cleanSlug === 'index') ? '/' : '/' + cleanSlug;

        if (window.location.pathname !== newPath) {
          window.history.replaceState(null, '', newPath);
        }

        // If unlocked and not on lock page, ensure background music is playing
        const isUnlocked = sessionStorage.getItem('celebration_unlocked') === 'true' || 
                           sessionStorage.getItem('celebration_music_enabled') === 'true';
        const isMuted = sessionStorage.getItem('celebration_music_muted') === 'true';
        if (isUnlocked && !isMuted && cleanSlug !== 'lock' && cleanSlug !== 'index') {
          window.CelebrationMusicMaster.play();
        }
      } catch (err) {}
    });

    // Handle browser Back / Forward buttons seamlessly
    window.addEventListener('popstate', () => {
      try {
        appFrame.contentWindow.history.back();
      } catch (err) {}
    });

    // Interaction fallback for autoplay policies
    const unlockMasterAudio = () => {
      const isUnlocked = sessionStorage.getItem('celebration_unlocked') === 'true' || 
                         sessionStorage.getItem('celebration_music_enabled') === 'true';
      const isMuted = sessionStorage.getItem('celebration_music_muted') === 'true';
      if (isUnlocked && !isMuted && masterAudio && masterAudio.paused) {
        window.CelebrationMusicMaster.play();
      }
    };
    window.addEventListener('pointerdown', unlockMasterAudio, { once: true });
    window.addEventListener('keydown', unlockMasterAudio, { once: true });
  </script>
</body>
</html>
