<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Happy Birthday Akshaya ✨</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>✨</text></svg>">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@600;700&family=Outfit:wght@400;500;600;700&family=Playfair+Display:ital,wght@0,600;1,600&display=swap">
  <style>
    :root {
      --bg-black: #080808;
      --gold-neon: #ffd700;
      --gold-warm: #f5af2d;
      --gold-bright: #ffea79;
      --text-white: #ffffff;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      width: 100%;
      height: 100%;
      background-color: var(--bg-black);
      color: var(--text-white);
      font-family: 'Outfit', -apple-system, BlinkMacSystemFont, sans-serif;
      overflow: hidden;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    /* ========================================================
       CINEMATIC BLACK TO BRIGHTNESS REVEAL
       ======================================================== */
    #cinematic-black-curtain {
      position: fixed;
      inset: 0;
      background: #000000;
      z-index: 999;
      pointer-events: none;
      animation: revealBrightness 2s cubic-bezier(0.4, 0, 0.2, 1) forwards;
    }

    @keyframes revealBrightness {
      0% { opacity: 1; }
      100% { opacity: 0; }
    }

    /* ========================================================
       TOP HEADER / BUTTON: "POP THE BALLOONS"
       (HEARTBEAT PULSE + BLINK HIGHLIGHT + FLOATING MOVEMENT)
       ======================================================== */
    .top-pop-header {
      position: fixed;
      top: 20px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 90;
      padding: 10px 28px;
      border-radius: 50px;
      background: linear-gradient(
        135deg,
        rgba(32, 26, 12, 0.88) 0%,
        rgba(15, 15, 18, 0.94) 50%,
        rgba(48, 38, 12, 0.88) 100%
      );
      border: 2px solid #ffd700;
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      color: #ffea79;
      font-family: 'Fredoka', sans-serif;
      font-size: 1.12rem;
      font-weight: 700;
      letter-spacing: 1.2px;
      text-transform: uppercase;
      cursor: pointer;
      pointer-events: auto;
      user-select: none;
      white-space: nowrap;
      display: inline-flex;
      align-items: center;
      gap: 10px;
      outline: none;
      animation: popButtonBeatBlinkMove 2.2s cubic-bezier(0.25, 1, 0.5, 1) infinite;
      transition: all 0.25s ease;
    }

    /* Beat + Blink Highlight + Movement Animation */
    @keyframes popButtonBeatBlinkMove {
      0% {
        transform: translateX(-50%) translateY(0px) scale(1) rotate(-1deg);
        border-color: rgba(255, 215, 0, 0.65);
        box-shadow: 
          0 0 16px rgba(255, 215, 0, 0.4),
          0 0 35px rgba(255, 174, 25, 0.2),
          inset 0 0 10px rgba(255, 215, 0, 0.25);
        color: #ffea79;
        text-shadow: none;
      }
      14% {
        transform: translateX(-50%) translateY(-3px) scale(1.09) rotate(0deg);
        border-color: #ffffff;
        box-shadow: 
          0 0 32px rgba(255, 255, 255, 0.95),
          0 0 65px rgba(255, 215, 0, 1),
          0 0 95px rgba(255, 174, 25, 0.75),
          inset 0 0 18px rgba(255, 255, 255, 0.75);
        color: #ffffff;
        text-shadow: 0 0 15px #ffd700, 0 0 25px #ffffff;
      }
      28% {
        transform: translateX(-50%) translateY(-1px) scale(1.02) rotate(1deg);
        border-color: #ffd700;
        box-shadow: 
          0 0 20px rgba(255, 215, 0, 0.5),
          0 0 40px rgba(255, 174, 25, 0.3),
          inset 0 0 12px rgba(255, 215, 0, 0.3);
        color: #ffea79;
        text-shadow: none;
      }
      42% {
        transform: translateX(-50%) translateY(-6px) scale(1.16) rotate(0deg);
        border-color: #ffffff;
        box-shadow: 
          0 0 45px rgba(255, 255, 255, 1),
          0 0 85px rgba(255, 215, 0, 1),
          0 0 115px rgba(255, 174, 25, 0.85),
          inset 0 0 24px rgba(255, 255, 255, 0.85);
        color: #ffffff;
        text-shadow: 0 0 18px #ffd700, 0 0 32px #ffffff;
      }
      70% {
        transform: translateX(-50%) translateY(-2px) scale(1) rotate(-0.5deg);
        border-color: #ffd700;
        box-shadow: 
          0 0 22px rgba(255, 215, 0, 0.45),
          0 0 45px rgba(255, 174, 25, 0.25),
          inset 0 0 12px rgba(255, 215, 0, 0.25);
        color: #ffea79;
        text-shadow: none;
      }
      85% {
        transform: translateX(-50%) translateY(3px) scale(1.04) rotate(0.5deg);
        border-color: #ffea79;
        box-shadow: 
          0 0 28px rgba(255, 215, 0, 0.6),
          0 0 55px rgba(255, 174, 25, 0.35);
      }
      100% {
        transform: translateX(-50%) translateY(0px) scale(1) rotate(-1deg);
        border-color: rgba(255, 215, 0, 0.65);
        box-shadow: 
          0 0 16px rgba(255, 215, 0, 0.4),
          0 0 35px rgba(255, 174, 25, 0.2),
          inset 0 0 10px rgba(255, 215, 0, 0.25);
        color: #ffea79;
        text-shadow: none;
      }
    }

    .top-pop-header:hover {
      border-color: #ffffff;
      box-shadow: 
        0 0 45px rgba(255, 215, 0, 1),
        0 0 85px rgba(255, 234, 121, 0.9),
        inset 0 0 22px rgba(255, 255, 255, 0.8);
      color: #ffffff;
      text-shadow: 0 0 15px #ffd700;
    }

    /* ========================================================
       MATCHING FIRST-PAGE BACKGROUND (BLURRED POSTER + FAIRY LIGHTS)
       ======================================================== */
    .backdrop-container {
      position: fixed;
      inset: 0;
      z-index: 0;
      pointer-events: none;
      overflow: hidden;
    }

    .backdrop-image {
      width: 100%;
      height: 100%;
      object-fit: cover;
      filter: blur(45px) brightness(0.28);
      transform: scale(1.15);
    }

    .backdrop-overlay {
      position: absolute;
      inset: 0;
      background: radial-gradient(circle at center, rgba(10, 10, 10, 0.25) 0%, rgba(5, 5, 5, 0.92) 85%);
    }

    /* Left & Right Cascading Golden Fairy Light Strings & Vines */
    .side-fairy-lights {
      position: fixed;
      top: -15px;
      bottom: 0;
      width: 24vw;
      z-index: 2;
      pointer-events: none;
      display: flex;
      justify-content: space-evenly;
      filter: blur(1px);
      opacity: 0.92;
    }

    .side-fairy-lights.left {
      left: 0;
      mask-image: linear-gradient(to right, rgba(0, 0, 0, 1) 55%, rgba(0, 0, 0, 0) 100%);
      -webkit-mask-image: linear-gradient(to right, rgba(0, 0, 0, 1) 55%, rgba(0, 0, 0, 0) 100%);
    }

    .side-fairy-lights.right {
      right: 0;
      mask-image: linear-gradient(to left, rgba(0, 0, 0, 1) 55%, rgba(0, 0, 0, 0) 100%);
      -webkit-mask-image: linear-gradient(to left, rgba(0, 0, 0, 1) 55%, rgba(0, 0, 0, 0) 100%);
    }

    .fairy-string {
      height: 75vh;
      width: 65px;
      transform-origin: top center;
      animation: swayBreeze 6s ease-in-out infinite alternate;
    }

    .fairy-string.delay-1 {
      height: 62vh;
      animation-delay: -2s;
    }

    .fairy-string.delay-2 {
      height: 70vh;
      animation-delay: -4s;
    }

    @keyframes swayBreeze {
      0% { transform: rotate(-2deg); }
      100% { transform: rotate(2deg); }
    }

    /* Upward Drifting Golden Sparkle Particles */
    .side-sparkles-container {
      position: fixed;
      top: 0;
      bottom: 0;
      width: 26vw;
      z-index: 3;
      pointer-events: none;
      overflow: hidden;
    }

    .side-sparkles-container.left { left: 0; }
    .side-sparkles-container.right { right: 0; }

    .drifting-sparkle {
      position: absolute;
      bottom: -20px;
      width: 5px;
      height: 5px;
      border-radius: 50%;
      background: #ffd700;
      box-shadow: 0 0 10px #ffd700, 0 0 20px #ffae19;
      animation: floatSparkleUp linear infinite;
      opacity: 0;
    }

    @keyframes floatSparkleUp {
      0% { transform: translateY(0) scale(0.6); opacity: 0; }
      20% { opacity: 0.9; }
      80% { opacity: 0.7; }
      100% { transform: translateY(-95vh) scale(1.2); opacity: 0; }
    }

    /* ========================================================
       CONTINUOUS BOTTOM-TO-TOP CLICKABLE GOLD & BLACK BALLOONS
       ======================================================== */
    #balloons-container {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
      z-index: 15;
      pointer-events: none;
      overflow: hidden;
    }

    .flying-balloon {
      position: absolute;
      bottom: -170px;
      will-change: transform, opacity;
      opacity: 0;
      pointer-events: auto;
      cursor: pointer;
      animation-name: riseBottomToTop;
      animation-timing-function: linear;
      animation-fill-mode: forwards;
      filter: drop-shadow(0 8px 18px rgba(255, 215, 0, 0.25));
      transition: filter 0.15s ease;
    }

    .flying-balloon:hover {
      filter: drop-shadow(0 0 24px rgba(255, 215, 0, 0.8));
    }

    @keyframes riseBottomToTop {
      0% {
        transform: translateY(0) translateX(0) rotate(-3deg);
        opacity: 0;
      }
      8% {
        opacity: 0.82;
      }
      35% {
        transform: translateY(-45vh) translateX(16px) rotate(4deg);
        opacity: 0.82;
      }
      70% {
        transform: translateY(-90vh) translateX(-14px) rotate(-4deg);
        opacity: 0.78;
      }
      92% {
        opacity: 0.72;
      }
      100% {
        transform: translateY(-130vh) translateX(8px) rotate(3deg);
        opacity: 0;
      }
    }

    /* Floating Pop Text: "Happy Bday Akki ✨" */
    .pop-wish-text {
      position: fixed;
      transform: translate(-50%, -50%) scale(0.6);
      z-index: 60;
      pointer-events: none;
      font-family: 'Fredoka', 'Outfit', sans-serif;
      font-size: clamp(1.25rem, 3.2vw, 1.85rem);
      font-weight: 700;
      letter-spacing: 0.8px;
      white-space: nowrap;
      color: #ffffff;
      background: linear-gradient(180deg, #ffffff 0%, #fff399 35%, #ffd700 75%, #ffb319 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      filter: drop-shadow(0 2px 8px rgba(0, 0, 0, 0.95)) drop-shadow(0 0 20px rgba(255, 215, 0, 0.95));
      animation: popWishFloat 1.8s cubic-bezier(0.2, 0.8, 0.2, 1) forwards;
    }

    @keyframes popWishFloat {
      0% {
        opacity: 0;
        transform: translate(-50%, -50%) scale(0.4) rotate(-3deg);
      }
      22% {
        opacity: 1;
        transform: translate(-50%, -75%) scale(1.18) rotate(0deg);
      }
      75% {
        opacity: 1;
        transform: translate(-50%, -125%) scale(1.04) rotate(1deg);
      }
      100% {
        opacity: 0;
        transform: translate(-50%, -160%) scale(0.9) rotate(-1deg);
      }
    }

    /* ========================================================
       CANVAS FOR FIRECRACKER & BALLOON BLASTS
       ======================================================== */
    #firecracker-canvas {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
      z-index: 16;
      pointer-events: none;
    }

    /* ========================================================
       OPEN CENTER CONTENT (NO OUTER SQUARE BOX)
       ======================================================== */
    .hero-content-wrapper {
      position: relative;
      z-index: 10;
      width: 100%;
      height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
      text-align: center;
      opacity: 0;
      transform: translateY(18px);
      animation: contentEntrance 1.6s cubic-bezier(0.2, 0.8, 0.2, 1) forwards 0.6s;
    }

    @keyframes contentEntrance {
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    /* GLASSY SHINY GOLD BUBBLE FONT: "HAPPY BIRTHDAY AKSHAYA" */
    .bubble-title-glass {
      display: inline-block;
      padding: 0.8rem 2.2rem;
      margin-bottom: 1.6rem;
      border-radius: 42px;
      background: linear-gradient(
        145deg,
        rgba(255, 240, 160, 0.16) 0%,
        rgba(255, 215, 0, 0.04) 50%,
        rgba(255, 190, 50, 0.14) 100%
      );
      border: 1.5px solid rgba(255, 225, 110, 0.55);
      box-shadow: 
        inset 0 2px 14px rgba(255, 255, 255, 0.45),
        inset 0 -4px 16px rgba(255, 185, 0, 0.35),
        0 0 35px rgba(255, 215, 0, 0.32);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
    }

    .birthday-main-title {
      font-family: 'Fredoka', sans-serif;
      font-size: clamp(2.2rem, 5.4vw, 4rem);
      font-weight: 700;
      letter-spacing: 2.5px;
      line-height: 1.18;
      text-transform: uppercase;
      background: linear-gradient(
        180deg,
        #ffffff 0%,
        #fff4a3 28%,
        #ffd700 55%,
        #e69c00 82%,
        #ffea79 100%
      );
      background-size: 200% auto;
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      -webkit-text-stroke: 1px rgba(255, 240, 170, 0.45);
      filter: drop-shadow(0 3px 6px rgba(0, 0, 0, 0.9)) drop-shadow(0 0 20px rgba(255, 215, 0, 0.75));
      animation: shimmerGold 4.5s linear infinite;
    }

    @keyframes shimmerGold {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    /* Golden Divider Line */
    .title-divider {
      width: 140px;
      height: 2px;
      background: linear-gradient(90deg, transparent, var(--gold-neon), transparent);
      margin: 0 auto 1.5rem;
      box-shadow: 0 0 12px var(--gold-neon);
    }

    /* Quote */
    .birthday-quote-box {
      max-width: 680px;
      margin: 0 auto 2.2rem;
    }

    .birthday-quote {
      font-family: 'Playfair Display', serif;
      font-style: italic;
      font-size: clamp(1.12rem, 2.3vw, 1.48rem);
      line-height: 1.65;
      color: #f8fafc;
      letter-spacing: 0.4px;
      text-shadow: 0 2px 14px rgba(0, 0, 0, 0.95), 0 0 20px rgba(255, 215, 0, 0.3);
    }

    /* ========================================================
       FOOTER ACTION BUTTONS (BELOW QUOTE, CLEAN & PROPORTIONAL)
       ======================================================== */
    .footer-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 14px;
      justify-content: center;
      align-items: center;
      z-index: 20;
    }

    .btn-proceed-surprise {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 11px 26px;
      border-radius: 50px;
      font-family: 'Outfit', sans-serif;
      font-size: 0.94rem;
      font-weight: 700;
      letter-spacing: 0.6px;
      color: #080808;
      text-decoration: none;
      background: linear-gradient(135deg, #ffd700 0%, #ffea79 50%, #f5af2d 100%);
      border: 1.5px solid #fff3b0;
      box-shadow: 0 0 22px rgba(255, 215, 0, 0.48), 0 6px 18px rgba(0, 0, 0, 0.85);
      transition: all 0.3s ease;
    }

    .btn-proceed-surprise:hover {
      transform: translateY(-2px) scale(1.04);
      background: #ffffff;
      box-shadow: 0 0 32px rgba(255, 215, 0, 0.85);
    }

    .btn-back-link {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      padding: 11px 22px;
      border-radius: 50px;
      font-family: 'Outfit', sans-serif;
      font-size: 0.9rem;
      font-weight: 600;
      color: #ffe89e;
      text-decoration: none;
      background: rgba(15, 15, 18, 0.78);
      backdrop-filter: blur(10px);
      border: 1.5px solid rgba(255, 215, 0, 0.55);
      box-shadow: 0 0 14px rgba(255, 215, 0, 0.22);
      transition: all 0.3s ease;
    }

    .btn-back-link:hover {
      color: #ffffff;
      border-color: #ffd700;
      background: rgba(35, 30, 15, 0.9);
      transform: translateY(-2px) scale(1.03);
    }

    /* Sound Mute Toggle */
    .audio-toggle-btn {
      position: fixed;
      top: 20px;
      right: 20px;
      z-index: 100;
      background: rgba(12, 12, 16, 0.75);
      border: 1px solid rgba(255, 215, 0, 0.45);
      color: var(--gold-bright);
      padding: 7px 14px;
      border-radius: 30px;
      font-size: 0.82rem;
      font-weight: 600;
      cursor: pointer;
      backdrop-filter: blur(12px);
      transition: all 0.25s ease;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    .audio-toggle-btn:hover {
      background: rgba(255, 215, 0, 0.18);
      border-color: var(--gold-neon);
      transform: scale(1.04);
    }

    /* Responsive Adjustments */
    @media (max-width: 768px) {
      .side-fairy-lights,
      .side-sparkles-container {
        display: none;
      }
      .top-pop-header {
        top: 64px;
        font-size: 0.9rem;
        padding: 6px 18px;
      }
      .bubble-title-glass {
        padding: 0.65rem 1.2rem;
        border-radius: 28px;
      }
      .birthday-main-title {
        font-size: 1.95rem;
        letter-spacing: 1px;
      }
      .birthday-quote {
        font-size: 1.02rem;
      }
      .btn-proceed-surprise,
      .btn-back-link {
        padding: 9px 18px;
        font-size: 0.86rem;
      }
    }
  </style>
</head>
<body>

  <!-- Cinematic Brightness Curtain -->
  <div id="cinematic-black-curtain" aria-hidden="true"></div>

  <!-- Top Interactive Button: Pop the Balloons (Heartbeat + Blink Highlight + Movement) -->
  <button type="button" class="top-pop-header" id="btn-top-pop" aria-label="Pop the Balloons">🎈 Pop the Balloons 🎈</button>

  <!-- Audio Toggle -->
  <button class="audio-toggle-btn" id="audio-toggle" aria-label="Toggle Sound Effects">
    <span id="audio-icon">🔊</span>
    <span id="audio-label">Festive Sound</span>
  </button>

  <!-- Matching First-Page Blurred Backdrop -->
  <div class="backdrop-container" aria-hidden="true">
    <img src="images/akshaya.jpg" alt="" class="backdrop-image">
    <div class="backdrop-overlay"></div>
  </div>

  <!-- Left Side: Cascading Golden Fairy Light Strings & Vines -->
  <aside class="side-fairy-lights left" aria-hidden="true">
    <svg class="fairy-string" viewBox="0 0 50 800" preserveAspectRatio="none">
      <path d="M 25 0 Q 35 200 20 400 T 25 800" stroke="rgba(245, 175, 45, 0.4)" stroke-width="1.5" fill="none"/>
      <circle cx="25" cy="80" r="5" fill="#ffd700" filter="drop-shadow(0 0 8px #ffd700)"/>
      <circle cx="32" cy="180" r="4.5" fill="#ffea79" filter="drop-shadow(0 0 8px #ffd700)"/>
      <ellipse cx="23" cy="290" rx="8" ry="5" fill="#ffae19" filter="drop-shadow(0 0 12px #ffae19)"/>
      <circle cx="20" cy="400" r="5.5" fill="#ffd700" filter="drop-shadow(0 0 8px #ffd700)"/>
      <circle cx="28" cy="520" r="4.5" fill="#ffea79" filter="drop-shadow(0 0 8px #ffd700)"/>
      <ellipse cx="24" cy="650" rx="8" ry="5" fill="#ffae19" filter="drop-shadow(0 0 12px #ffae19)"/>
      <circle cx="25" cy="760" r="5" fill="#ffd700" filter="drop-shadow(0 0 8px #ffd700)"/>
      <ellipse cx="28" cy="120" rx="4" ry="7" fill="rgba(74, 222, 128, 0.65)" transform="rotate(25 28 120)"/>
      <ellipse cx="19" cy="230" rx="4" ry="7" fill="rgba(74, 222, 128, 0.65)" transform="rotate(-30 19 230)"/>
      <ellipse cx="26" cy="350" rx="4" ry="7" fill="rgba(74, 222, 128, 0.65)" transform="rotate(20 26 350)"/>
      <ellipse cx="18" cy="470" rx="4" ry="7" fill="rgba(74, 222, 128, 0.65)" transform="rotate(-25 18 470)"/>
      <ellipse cx="29" cy="590" rx="4" ry="7" fill="rgba(74, 222, 128, 0.65)" transform="rotate(30 29 590)"/>
    </svg>

    <svg class="fairy-string delay-1" viewBox="0 0 50 800" preserveAspectRatio="none">
      <path d="M 25 0 Q 15 250 30 500 T 25 800" stroke="rgba(245, 175, 45, 0.35)" stroke-width="1.2" fill="none"/>
      <circle cx="25" cy="130" r="4.5" fill="#ffea79" filter="drop-shadow(0 0 8px #ffd700)"/>
      <ellipse cx="20" cy="240" rx="7" ry="4.5" fill="#ffae19" filter="drop-shadow(0 0 10px #ffae19)"/>
      <circle cx="28" cy="360" r="5" fill="#ffd700" filter="drop-shadow(0 0 8px #ffd700)"/>
      <circle cx="22" cy="480" r="4" fill="#ffea79" filter="drop-shadow(0 0 8px #ffd700)"/>
      <ellipse cx="26" cy="610" rx="7.5" ry="5" fill="#ffae19" filter="drop-shadow(0 0 10px #ffae19)"/>
      <circle cx="25" cy="730" r="4.5" fill="#ffd700" filter="drop-shadow(0 0 8px #ffd700)"/>
      <ellipse cx="20" cy="170" rx="4" ry="7" fill="rgba(74, 222, 128, 0.6)" transform="rotate(-20 20 170)"/>
      <ellipse cx="30" cy="300" rx="4" ry="7" fill="rgba(74, 222, 128, 0.6)" transform="rotate(35 30 300)"/>
      <ellipse cx="18" cy="420" rx="4" ry="7" fill="rgba(74, 222, 128, 0.6)" transform="rotate(-25 18 420)"/>
      <ellipse cx="29" cy="540" rx="4" ry="7" fill="rgba(74, 222, 128, 0.6)" transform="rotate(25 29 540)"/>
    </svg>
  </aside>

  <!-- Left Side: Upward Drifting Golden Sparkles -->
  <div class="side-sparkles-container left" aria-hidden="true">
    <div class="drifting-sparkle" style="left: 20%; animation-delay: 0s; animation-duration: 7s;"></div>
    <div class="drifting-sparkle" style="left: 55%; animation-delay: 2.2s; animation-duration: 9s;"></div>
    <div class="drifting-sparkle" style="left: 75%; animation-delay: 4.5s; animation-duration: 8s;"></div>

  <!-- Right Side: Cascading Golden Fairy Light Strings & Vines -->
  <aside class="side-fairy-lights right" aria-hidden="true">
    <svg class="fairy-string delay-2" viewBox="0 0 50 800" preserveAspectRatio="none">

      <circle cx="25" cy="90" r="5" fill="#ffd700" filter="drop-shadow(0 0 8px #ffd700)"/>

  <!-- Right Side: Upward Drifting Golden Sparkles -->
  <div class="side-sparkles-container right" aria-hidden="true">
    <div class="drifting-sparkle" style="left: 25%; animation-delay: 1.2s; animation-duration: 8.5s;"></div>
    <div class="drifting-sparkle" style="left: 60%; animation-delay: 3.5s; animation-duration: 7.2s;"></div>
    <div class="drifting-sparkle" style="left: 80%; animation-delay: 5.1s; animation-duration: 9.2s;"></div>

  </div>

  <!-- Continuous Bottom-to-Top Gold & Black Semi-Transparent Floating Balloons -->
  <div id="balloons-container"></div>

  <!-- Firecracker & Balloon Blasts Canvas -->
  <canvas id="firecracker-canvas"></canvas>

  <!-- Open Center Stage (No Outer Square Box) -->
  <main class="hero-content-wrapper">
    
    <!-- Glassy Shiny Gold Bubble Headline -->
    <div class="bubble-title-glass">
      <h1 class="birthday-main-title">HAPPY BIRTHDAY<br>AKSHAYA</h1>
    </div>

    <!-- Glowing Divider -->
    <div class="title-divider" aria-hidden="true"></div>

    <!-- Quote -->
    <div class="birthday-quote-box">
      <p class="birthday-quote">
        "Happy Birthday! Never Stop Shining - The World Is better with your light in it."
      </p>
    </div>

    <!-- Footer Buttons Placed Cleanly Below Quote -->
    <footer class="footer-actions">
      <a href="surprise.html" class="btn-proceed-surprise" id="btn-next">
        <span>Continue to Balloon Surprise 🎈</span>
      </a>
      <a href="index.html" class="btn-back-link">
        <span>← Back to Photo</span>
      </a>
    </footer>

  </main>

  <script>
    // =========================================================================
    // 1. ACOUSTIC FIRECRACKER & BALLOON POP SOUND SYNTHESIS
    // =========================================================================
    let audioCtx = null;
    let isSoundMuted = false;

    function getAudioContext() {
      if (!audioCtx) {
        const AudioClass = window.AudioContext || window.webkitAudioContext;
        audioCtx = new AudioClass();
      }
      if (audioCtx.state === 'suspended') {
        audioCtx.resume();
      }
      return audioCtx;
    }

    function playFirecrackerBurstSound() {
      if (isSoundMuted) return;
      try {
        const ctx = getAudioContext();
        const now = ctx.currentTime;

        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(145 + Math.random() * 45, now);
        osc.frequency.exponentialRampToValueAtTime(32, now + 0.3);

        gain.gain.setValueAtTime(0.24, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.32);

        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start(now);
        osc.stop(now + 0.35);

        const bufferSize = ctx.sampleRate * 0.45;
        const noiseBuffer = ctx.createBuffer(1, bufferSize, ctx.sampleRate);
        const data = noiseBuffer.getChannelData(0);
        for (let i = 0; i < bufferSize; i++) {
          data[i] = (Math.random() > 0.88 ? (Math.random() * 2 - 1) : 0) * 0.5;
        }

        const noise = ctx.createBufferSource();
        noise.buffer = noiseBuffer;

        const filter = ctx.createBiquadFilter();
        filter.type = 'highpass';
        filter.frequency.setValueAtTime(1950, now);

        const noiseGain = ctx.createGain();
        noiseGain.gain.setValueAtTime(0.2, now);
        noiseGain.gain.exponentialRampToValueAtTime(0.001, now + 0.45);

        noise.connect(filter);
        filter.connect(noiseGain);
        noiseGain.connect(ctx.destination);
        noise.start(now);
      } catch (e) {}
    }

    const audioBtn = document.getElementById('audio-toggle');
    const audioIcon = document.getElementById('audio-icon');
    const audioLabel = document.getElementById('audio-label');

    if (audioBtn) {
      audioBtn.addEventListener('click', () => {
        getAudioContext();
        isSoundMuted = !isSoundMuted;
        if (isSoundMuted) {
          audioIcon.textContent = '🔇';
          audioLabel.textContent = 'Muted';
        } else {
          audioIcon.textContent = '🔊';
          audioLabel.textContent = 'Festive Sound';
          playFirecrackerBurstSound();
        }
      });
    }

    window.addEventListener('click', () => getAudioContext(), { once: true });

    // =========================================================================
    // 2. TARGETED BLAST HELPER (FOR POPPED BALLOONS & FIRECRACKERS)
    // =========================================================================
    const canvas = document.getElementById('firecracker-canvas');
    const ctx = canvas.getContext('2d');
    let particles = [];
    let shockwaves = [];
    let animId = null;

    function resizeCanvas() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    function triggerBlastAt(bx, by) {
      playFirecrackerBurstSound();

      shockwaves.push({
        x: bx,
        y: by,
        radius: 4,
        maxRadius: 90 + Math.random() * 40,
        speed: 5.8,
        opacity: 0.95,
        color: Math.random() > 0.35 ? '#ffd700' : '#ffffff'
      });

      const count = 48;
      const blastColors = ['#ffd700', '#ffea79', '#ff1a40', '#ffffff', '#ffae19', '#00f3ff', '#ff6b81'];

      for (let i = 0; i < count; i++) {
        const angle = Math.random() * Math.PI * 2;
        const speed = 2.6 + Math.random() * 8.8;
        particles.push({
          x: bx,
          y: by,
          vx: Math.cos(angle) * speed,
          vy: Math.sin(angle) * speed - 0.6,
          friction: 0.94 + Math.random() * 0.03,
          gravity: 0.12 + Math.random() * 0.05,
          size: 2.3 + Math.random() * 3.5,
          color: blastColors[Math.floor(Math.random() * blastColors.length)],
          opacity: 1.0,
          life: 0,
          maxLife: 45 + Math.random() * 35,
          isGlitter: Math.random() > 0.45
        });
      }

      if (!animId) {
        animateParticles();
      }
    }

    // =========================================================================
    // 3. CONTINUOUS BOTTOM-TO-TOP CLICKABLE GOLD & BLACK BALLOONS
    // =========================================================================
    const balloonsContainer = document.getElementById('balloons-container');

    const balloonPalettes = [
      {
        light: 'rgba(255, 250, 190, 0.92)',
        fill: 'rgba(255, 215, 0, 0.72)',
        dark: 'rgba(179, 125, 0, 0.78)',
        rim: 'rgba(255, 235, 130, 0.85)',
        stroke: 'rgba(255, 225, 100, 0.65)'
      },
      {
        light: 'rgba(255, 245, 210, 0.9)',
        fill: 'rgba(245, 175, 45, 0.7)',
        dark: 'rgba(145, 90, 10, 0.78)',
        rim: 'rgba(255, 220, 110, 0.85)',
        stroke: 'rgba(255, 200, 80, 0.6)'
      },
      {
        light: 'rgba(255, 225, 130, 0.55)',
        fill: 'rgba(22, 22, 26, 0.74)',
        dark: 'rgba(5, 5, 8, 0.86)',
        rim: 'rgba(255, 215, 0, 0.75)',
        stroke: 'rgba(255, 215, 0, 0.65)'
      },
      {
        light: 'rgba(255, 235, 165, 0.5)',
        fill: 'rgba(32, 30, 34, 0.72)',
        dark: 'rgba(10, 10, 12, 0.85)',
        rim: 'rgba(245, 175, 45, 0.75)',
        stroke: 'rgba(245, 175, 45, 0.6)'
      }
    ];

    function createBalloonSVG(palette) {
      const gradId = 'bg_' + Math.random().toString(36).substr(2, 8);
      return `
        <svg viewBox="0 0 100 160" width="100%" height="100%">
          <defs>
            <radialGradient id="${gradId}" cx="34%" cy="30%" r="68%">
              <stop offset="0%" stop-color="${palette.light}" />
              <stop offset="35%" stop-color="${palette.fill}" />
              <stop offset="85%" stop-color="${palette.dark}" />
              <stop offset="100%" stop-color="${palette.rim}" />
            </radialGradient>
          </defs>
          <path d="M 50 8 C 80 8 92 35 92 60 C 92 92 65 118 53 122 L 47 122 C 35 118 8 92 8 60 C 8 35 20 8 50 8 Z"
                fill="url(#${gradId})"
                stroke="${palette.stroke}"
                stroke-width="1.2" />
          <ellipse cx="32" cy="35" rx="11" ry="21" transform="rotate(-26 32 35)" fill="rgba(255, 255, 255, 0.42)" />
          <polygon points="46,122 54,122 56,127 44,127" fill="${palette.dark}" stroke="${palette.stroke}" stroke-width="0.8" />
          <path d="M 50 127 Q 44 138 55 146 T 48 160" stroke="rgba(255, 215, 0, 0.75)" stroke-width="1.5" fill="none" />
        </svg>
      `;
    }

    // Given text pool with "Happy Bday Akki ✨" prominently featured
    const givenWishTexts = [
      'Happy Bday Akki ✨',
      'Happy Birthday Akshaya 💖',
      'Never Stop Shining ✨',
      'Happy Bday Akki ✨',
      'Keep Smiling Akshaya 🌸',
      'Happy 25th Akki 🎂',
      'Happy Bday Akki ✨'
    ];
    let wishTextIndex = 0;

    function getNextWishText() {
      const text = givenWishTexts[wishTextIndex % givenWishTexts.length];
      wishTextIndex++;
      return text;
    }

    function spawnFloatingBalloon() {
      if (!balloonsContainer) return;

      const balloon = document.createElement('div');
      balloon.className = 'flying-balloon';

      const isLeftSide = Math.random() > 0.5;
      const leftPct = isLeftSide
        ? (3 + Math.random() * 21)    // 3% to 24%
        : (74 + Math.random() * 21);  // 74% to 95%

      balloon.style.left = `${leftPct}%`;

      const scale = 0.68 + Math.random() * 0.42;
      const duration = 7.5 + Math.random() * 4.5;

      balloon.style.width = `${scale * 82}px`;
      balloon.style.height = `${scale * 132}px`;
      balloon.style.animationDuration = `${duration}s`;

      const palette = balloonPalettes[Math.floor(Math.random() * balloonPalettes.length)];
      balloon.innerHTML = createBalloonSVG(palette);

      // Core Pop & Blast function
      function blastThisBalloon(customText) {
        if (balloon.dataset.popped) return;
        balloon.dataset.popped = 'true';
        clearTimeout(autoBlastTimer);

        const rect = balloon.getBoundingClientRect();
        const hasValidRect = rect.width > 0 && rect.top > -40 && rect.bottom > 0;
        const centerX = hasValidRect
          ? (rect.left + rect.width / 2)
          : (window.innerWidth * (leftPct / 100));
        const centerY = hasValidRect
          ? (rect.top + rect.height * 0.4)
          : (window.innerHeight * (0.35 + Math.random() * 0.3));

        // Fire acoustic firecracker pop & shockwave particles
        triggerBlastAt(centerX, centerY);

        // Display floating given text at blast position
        const wishEl = document.createElement('div');
        wishEl.className = 'pop-wish-text';
        wishEl.textContent = customText || getNextWishText();
        wishEl.style.left = `${centerX}px`;
        wishEl.style.top = `${centerY}px`;
        document.body.appendChild(wishEl);

        setTimeout(() => wishEl.remove(), 1850);
        balloon.remove();
      }

      // AUTOMATIC BLAST: Balloon rises midway and blasts automatically, showing given text!
      const autoBlastDelay = 2200 + Math.random() * 2600; // 2.2s to 4.8s into the ascent
      const autoBlastTimer = setTimeout(() => {
        blastThisBalloon();
      }, autoBlastDelay);

      // MANUAL POP: Also allows user to tap/click to blast instantly
      balloon.addEventListener('pointerdown', (e) => {
        e.stopPropagation();
        blastThisBalloon('Happy Bday Akki ✨');
      });

      balloonsContainer.appendChild(balloon);

      // Fallback cleanup
      setTimeout(() => {
        clearTimeout(autoBlastTimer);
        if (!balloon.dataset.popped) balloon.remove();
      }, duration * 1000 + 400);
    }

    function startBalloonSpawner() {
      for (let i = 0; i < 4; i++) {
        setTimeout(spawnFloatingBalloon, i * 450);
      }
      setInterval(spawnFloatingBalloon, 1100);
    }

    startBalloonSpawner();

    // =========================================================================
    // 4. RANDOM FIRECRACKER BLASTS ENGINE
    // =========================================================================
    function spawnRandomFirecracker() {
      const w = canvas.width;
      const h = canvas.height;

      let bx, by;
      const marginX = w * 0.1;
      const marginY = h * 0.1;

      const locChoice = Math.random();
      if (locChoice < 0.4) {
        bx = marginX + Math.random() * (w - 2 * marginX);
        by = marginY + Math.random() * (h * 0.25);
      } else if (locChoice < 0.7) {
        bx = marginX * 0.5 + Math.random() * (w * 0.24);
        by = marginY + Math.random() * (h * 0.72);
      } else {
        bx = w - (marginX * 0.5 + Math.random() * (w * 0.24));
        by = marginY + Math.random() * (h * 0.72);
      }

      triggerBlastAt(bx, by);
    }

    function animateParticles() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      for (let i = shockwaves.length - 1; i >= 0; i--) {
        const sw = shockwaves[i];
        sw.radius += sw.speed;
        const prog = sw.radius / sw.maxRadius;
        sw.opacity = Math.max(0, 0.95 * (1 - prog));

        ctx.save();
        ctx.globalAlpha = sw.opacity;
        ctx.strokeStyle = sw.color;
        ctx.shadowColor = sw.color;
        ctx.shadowBlur = 18;
        ctx.lineWidth = 3.0 * (1 - prog);
        ctx.beginPath();
        ctx.arc(sw.x, sw.y, sw.radius, 0, Math.PI * 2);
        ctx.stroke();
        ctx.restore();

        if (sw.radius >= sw.maxRadius) {
          shockwaves.splice(i, 1);
        }
      }

      for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];
        p.vx *= p.friction;
        p.vy *= p.friction;
        p.vy += p.gravity;
        p.x += p.vx;
        p.y += p.vy;
        p.life++;

        const prog = p.life / p.maxLife;
        p.opacity = Math.max(0, 1.0 - prog);

        ctx.save();
        ctx.globalAlpha = p.opacity;
        ctx.fillStyle = p.color;
        ctx.shadowColor = p.color;
        ctx.shadowBlur = p.isGlitter ? 14 : 6;

        ctx.beginPath();
        ctx.arc(p.x, p.y, p.size * (1 - prog * 0.5), 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();

        if (p.life >= p.maxLife) {
          particles.splice(i, 1);
        }
      }

      if (particles.length > 0 || shockwaves.length > 0) {
        animId = requestAnimationFrame(animateParticles);
      } else {
        animId = null;
      }
    }

    // =========================================================================
    // 5. TOP "POP THE BALLOONS" BUTTON CLICK LISTENER
    // =========================================================================
    const topPopBtn = document.getElementById('btn-top-pop');
    if (topPopBtn) {
      topPopBtn.addEventListener('click', (e) => {
        e.preventDefault();
        getAudioContext();

        // 1. Blast right at the top button
        const btnRect = topPopBtn.getBoundingClientRect();
        triggerBlastAt(btnRect.left + btnRect.width / 2, btnRect.bottom + 10);

        // 2. Pop all active floating balloons on screen in a cascade
        const activeBalloons = document.querySelectorAll('.flying-balloon:not([data-popped])');
        if (activeBalloons.length > 0) {
          activeBalloons.forEach((b, idx) => {
            setTimeout(() => {
              if (b.dataset.popped) return;
              b.dataset.popped = 'true';
              const rect = b.getBoundingClientRect();
              const cx = rect.left + rect.width / 2;
              const cy = rect.top + rect.height * 0.4;
              triggerBlastAt(cx, cy);

              const wishEl = document.createElement('div');
              wishEl.className = 'pop-wish-text';
              wishEl.textContent = 'Happy Bday Akki ✨';
              wishEl.style.left = `${cx}px`;
              wishEl.style.top = `${cy}px`;
              document.body.appendChild(wishEl);

              setTimeout(() => wishEl.remove(), 1450);
              b.remove();
            }, idx * 90);
          });
        } else {
          // If none on screen yet, spawn balloons and burst them
          for (let i = 0; i < 3; i++) {
            setTimeout(spawnFloatingBalloon, i * 200);
          }
        }
      });
    }

    function scheduleNextBlast() {
      spawnRandomFirecracker();
      const nextDelay = 650 + Math.random() * 1150;
      setTimeout(scheduleNextBlast, nextDelay);
    }

    setTimeout(scheduleNextBlast, 1200);
  </script>
