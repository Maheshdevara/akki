<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#060608">
  <title>A Secret Awaits ✨ — Akshaya's 25th Birthday</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🌌</text></svg>">
  <link rel="stylesheet" href="css/fullscreen.css">
  <link rel="stylesheet" href="css/music.css">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      width: 100%;
      height: 100%;
      height: 100dvh;
      background-color: #060608;
      overflow: hidden;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    #app-frame {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      height: 100dvh;
      border: none;
      outline: none;
      display: block;
      z-index: 1;
      background-color: #060608;
    }
  </style>
</head>
<body>

  <!-- Background Music Audio Element (Looping & Continuous across celebration) -->
  <audio id="bgm-player" src="audio/bday_music.mp3" preload="auto" loop playsinline></audio>

  <!-- Floating Music Toggle Controller -->
  <button id="master-music-btn" class="global-music-btn muted" aria-label="Toggle Birthday Music" style="display: none;">
    <span class="music-icon">🎵</span>
    <span class="music-label">Birthday Music</span>
  </button>

  <!-- Seamless Continuous Fullscreen Presentation Shell -->
  <iframe
    id="app-frame"
    src="lock.html"
    allow="fullscreen; autoplay; camera; microphone"
    allowfullscreen="true"
    webkitallowfullscreen="true"
    mozallowfullscreen="true"
    title="Akshaya Celebration Universe">
  </iframe>

  <!-- Master Fullscreen Controller Script -->
  <script src="js/fullscreen.js"></script>
  <!-- Master Music Controller Script -->
  <script src="js/music.js"></script>

  <script>
    // Synchronize document title, URL bar and background music
    const appFrame = document.getElementById('app-frame');

    // Handle deep-link query parameter e.g. /?page=page1.html
    try {
      const urlParams = new URLSearchParams(window.location.search);
      const targetPage = urlParams.get('page');
      if (targetPage && targetPage !== 'index.html') {
        appFrame.src = targetPage;
        // If starting directly from Page 1 or later, trigger music
        if (targetPage !== 'lock.html' && window.triggerStartFromPage1) {
          window.triggerStartFromPage1();
        }
      }
    } catch (e) {}

    appFrame.addEventListener('load', () => {
      try {
        const childDoc = appFrame.contentDocument || appFrame.contentWindow.document;
        if (childDoc && childDoc.title) {
          document.title = childDoc.title;
        }

        const childPath = appFrame.contentWindow.location.pathname;
        const pageFile = childPath.split('/').pop() || 'lock.html';
        const cleanSlug = pageFile.replace('.html', '');
        const newPath = (cleanSlug === 'lock' || cleanSlug === 'index') ? '/' : '/' + cleanSlug;

        if (window.location.pathname !== newPath) {
          window.history.replaceState(null, '', newPath);
        }

        // Start music when arriving at Page 1 or any subsequent page
        if (cleanSlug !== 'lock' && cleanSlug !== 'index' && window.triggerStartFromPage1) {
          window.triggerStartFromPage1();
        }
      } catch (err) {}
    });

    // Handle browser Back / Forward buttons seamlessly
    window.addEventListener('popstate', () => {
      try {
        appFrame.contentWindow.history.back();
      } catch (err) {}
    });
  </script>
</body>
</html>
