<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>A Secret Awaits ✨</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🌌</text></svg>">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;800&family=Outfit:wght@400;500;600;700;800&family=Playfair+Display:ital,wght@0,600;0,700;1,600&display=swap">
  <style>
    :root {
      --bg-black: #060608;
      --gold-neon: #ffd700;
      --gold-warm: #f5af2d;
      --gold-bright: #ffea79;
      --gold-white: #fffdf0;
      --text-white: #ffffff;
      --error-red: #ff4d6d;
      --success-green: #4ade80;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      width: 100%;
      height: 100%;
      background-color: var(--bg-black);
      color: var(--text-white);
      font-family: 'Outfit', -apple-system, BlinkMacSystemFont, sans-serif;
      overflow: hidden;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    /* ========================================================
       BACKGROUND STARFIELD & SHOOTING STARS
       ======================================================== */
    #starfield-canvas {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
      z-index: 1;
      pointer-events: none;
    }

    /* Ambient Celestial Glow in center */
    .cosmic-nebula-glow {
      position: fixed;
      inset: 0;
      z-index: 1;
      pointer-events: none;
      background: radial-gradient(circle at 50% 50%, rgba(255, 215, 0, 0.04) 0%, rgba(13, 11, 24, 0.2) 50%, transparent 80%);
    }

    /* Left & Right Cascading Golden Fairy Light Strings */
    .side-fairy-lights {
      position: fixed;
      top: -15px;
      bottom: 0;
      width: 18vw;
      max-width: 180px;
      z-index: 2;
      pointer-events: none;
      display: flex;
      justify-content: space-evenly;
      filter: blur(1.2px);
      opacity: 0.85;
    }

    .side-fairy-lights.left {
      left: 0;
      mask-image: linear-gradient(to right, rgba(0, 0, 0, 1) 50%, rgba(0, 0, 0, 0) 100%);
      -webkit-mask-image: linear-gradient(to right, rgba(0, 0, 0, 1) 50%, rgba(0, 0, 0, 0) 100%);
    }

    .side-fairy-lights.right {
      right: 0;
      mask-image: linear-gradient(to left, rgba(0, 0, 0, 1) 50%, rgba(0, 0, 0, 0) 100%);
      -webkit-mask-image: linear-gradient(to left, rgba(0, 0, 0, 1) 50%, rgba(0, 0, 0, 0) 100%);
    }

    .fairy-string {
      height: 75vh;
      width: 50px;
      transform-origin: top center;
      animation: swayBreeze 6s ease-in-out infinite alternate;
    }

    .fairy-string.delay-1 {
      height: 65vh;
      animation-delay: -2.5s;
    }

    @keyframes swayBreeze {
      0% { transform: rotate(-2deg); }
      100% { transform: rotate(2deg); }
    }

    /* ========================================================
       CENTER GLASSMORPHISM LOCK CARD (PERFECTLY FIT ON SCREEN)
       ======================================================== */
    .lock-stage {
      position: relative;
      z-index: 10;
      width: 100%;
      height: 100vh;
      height: 100dvh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0.75rem;
      perspective: 1200px;
    }

    .lock-card {
      position: relative;
      width: 100%;
      max-width: 340px;
      padding: 1.35rem 1.25rem 1.15rem;
      background: radial-gradient(circle at 50% 0%, rgba(28, 25, 20, 0.75), rgba(11, 11, 14, 0.84));
      border: 1.2px solid rgba(255, 215, 0, 0.42);
      border-radius: 22px;
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      box-shadow:
        0 0 35px rgba(255, 215, 0, 0.14),
        inset 0 1px 0 rgba(255, 255, 255, 0.18),
        inset 0 0 18px rgba(255, 215, 0, 0.05),
        0 18px 45px rgba(0, 0, 0, 0.95);
      text-align: center;
      transform-style: preserve-3d;
      transition: transform 0.2s cubic-bezier(0.2, 0.8, 0.2, 1), box-shadow 0.3s ease, border-color 0.3s ease, opacity 0.5s ease;
      will-change: transform, opacity;
    }

    /* Ambient card border sweep */
    .lock-card::before {
      content: '';
      position: absolute;
      inset: -1px;
      border-radius: 23px;
      padding: 1px;
      background: linear-gradient(135deg, rgba(255, 215, 0, 0.6) 0%, rgba(255, 215, 0, 0.08) 50%, rgba(255, 215, 0, 0.5) 100%);
      -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
      -webkit-mask-composite: xor;
      mask-composite: exclude;
      pointer-events: none;
    }

    /* Wrong password glitch/shake */
    .lock-card.error-shake {
      animation: developerGlitchShake 0.48s cubic-bezier(0.36, 0.07, 0.19, 0.97) both;
      border-color: var(--error-red);
      box-shadow: 0 0 32px rgba(255, 77, 109, 0.5), inset 0 0 15px rgba(255, 77, 109, 0.2);
    }

    @keyframes developerGlitchShake {
      0%, 100% { transform: translateX(0); }
      15% { transform: translateX(-8px) rotate(-1deg); }
      30% { transform: translateX(8px) rotate(1deg); }
      45% { transform: translateX(-6px) rotate(-0.5deg); }
      60% { transform: translateX(6px) rotate(0.5deg); }
      75% { transform: translateX(-3px); }
      90% { transform: translateX(3px); }
    }

    /* Glowing Golden Padlock Badge */
    .padlock-badge {
      position: absolute;
      top: -21px;
      left: 50%;
      transform: translateX(-50%);
      width: 42px;
      height: 42px;
      border-radius: 50%;
      background: linear-gradient(145deg, #242014, #0d0c09);
      border: 1.5px solid #ffd700;
      box-shadow: 0 0 18px rgba(255, 215, 0, 0.55);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.25rem;
      transition: all 0.35s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    .padlock-badge.unlocked {
      border-color: var(--success-green);
      box-shadow: 0 0 25px rgba(74, 222, 128, 0.8), 0 0 45px rgba(74, 222, 128, 0.4);
      transform: translateX(-50%) scale(1.15);
    }

    .secret-subtitle {
      font-family: 'Cinzel', serif;
      font-size: 0.68rem;
      font-weight: 700;
      letter-spacing: 2.2px;
      color: var(--gold-bright);
      text-transform: uppercase;
      margin-bottom: 0.3rem;
      opacity: 0.92;
    }

    .secret-question {
      font-family: 'Playfair Display', serif;
      font-size: 1.15rem;
      font-weight: 600;
      line-height: 1.25;
      color: #ffffff;
      margin-bottom: 0.75rem;
      text-shadow: 0 2px 10px rgba(0, 0, 0, 0.85);
    }

    .secret-question span {
      color: var(--gold-neon);
      text-shadow: 0 0 10px rgba(255, 215, 0, 0.5);
    }

    /* Digital Time Display Box */
    .password-display {
      width: 100%;
      height: 44px;
      margin-bottom: 0.7rem;
      border-radius: 12px;
      background: rgba(6, 6, 8, 0.9);
      border: 1.3px solid rgba(255, 215, 0, 0.45);
      box-shadow: inset 0 0 14px rgba(255, 215, 0, 0.1);
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Outfit', monospace;
      font-size: 1.45rem;
      font-weight: 700;
      letter-spacing: 5px;
      color: var(--gold-bright);
      text-shadow: 0 0 12px rgba(255, 215, 0, 0.6);
      transition: all 0.25s ease;
      position: relative;
      overflow: hidden;
    }

    .password-display.placeholder {
      color: rgba(255, 234, 121, 0.32);
      font-size: 1.22rem;
    }

    .password-display.error {
      border-color: var(--error-red);
      color: #ff6b81;
      box-shadow: 0 0 20px rgba(255, 77, 109, 0.45), inset 0 0 12px rgba(255, 77, 109, 0.2);
      text-shadow: 0 0 14px rgba(255, 77, 109, 0.85);
    }

    .password-display.success {
      border-color: var(--success-green);
      color: var(--success-green);
      box-shadow: 0 0 22px rgba(74, 222, 128, 0.5), inset 0 0 12px rgba(74, 222, 128, 0.2);
      text-shadow: 0 0 14px rgba(74, 222, 128, 0.9);
    }

    /* ========================================================
       3x4 CLICKABLE COMPACT KEYPAD
       ======================================================== */
    .keypad-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 7px;
      max-width: 216px;
      margin: 0 auto 0.65rem;
    }

    .key-btn {
      width: 50px;
      height: 50px;
      margin: 0 auto;
      border-radius: 50%;
      background: radial-gradient(circle at 35% 30%, rgba(255, 215, 0, 0.16), rgba(16, 16, 20, 0.92));
      border: 1.2px solid rgba(255, 215, 0, 0.38);
      color: #fff9e6;
      font-family: 'Outfit', sans-serif;
      font-size: 1.15rem;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.6);
      transition: transform 0.14s cubic-bezier(0.2, 0.8, 0.2, 1), background 0.16s ease, box-shadow 0.16s ease, border-color 0.16s ease;
      position: relative;
      overflow: hidden;
    }

    .key-btn:hover {
      border-color: #ffd700;
      background: radial-gradient(circle at 35% 30%, rgba(255, 215, 0, 0.32), rgba(32, 28, 16, 0.95));
      box-shadow: 0 0 14px rgba(255, 215, 0, 0.5);
      transform: translateY(-2px);
    }

    .key-btn:active, .key-btn.tap-flash {
      transform: scale(0.91);
      background: rgba(255, 215, 0, 0.45);
      box-shadow: 0 0 20px rgba(255, 215, 0, 0.85);
      border-color: #ffffff;
    }

    /* Hint Section */
    .hint-toggle {
      background: none;
      border: none;
      color: rgba(255, 234, 121, 0.85);
      font-family: 'Outfit', sans-serif;
      font-size: 0.78rem;
      font-weight: 500;
      cursor: pointer;
      margin-bottom: 0.4rem;
      text-decoration: underline;
      text-underline-offset: 3px;
      transition: color 0.2s ease;
    }

    .hint-toggle:hover {
      color: #ffd700;
    }

    .hint-box {
      display: none;
      font-size: 0.77rem;
      color: #ffea79;
      background: rgba(255, 215, 0, 0.1);
      border: 1px solid rgba(255, 215, 0, 0.3);
      border-radius: 10px;
      padding: 5px 10px;
      margin-bottom: 0.5rem;
      animation: fadeInHint 0.3s ease;
    }

    .hint-box.visible {
      display: block;
    }

    @keyframes fadeInHint {
      from { opacity: 0; transform: translateY(-4px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .status-msg {
      min-height: 16px;
      font-size: 0.78rem;
      font-weight: 600;
      color: #ff6b81;
      margin-bottom: 0.45rem;
      transition: all 0.2s ease;
    }

    /* Unlock Button */
    .btn-unlock {
      width: 100%;
      height: 40px;
      border-radius: 50px;
      border: 1.5px solid #fff3b0;
      background: linear-gradient(135deg, #ffd700 0%, #ffea79 50%, #f5af2d 100%);
      color: #080808;
      font-family: 'Outfit', sans-serif;
      font-size: 0.92rem;
      font-weight: 700;
      letter-spacing: 0.5px;
      cursor: pointer;
      box-shadow: 0 0 20px rgba(255, 215, 0, 0.45);
      transition: all 0.25s ease;
    }

    .btn-unlock:hover {
      transform: translateY(-2px) scale(1.02);
      background: #ffffff;
      box-shadow: 0 0 28px rgba(255, 215, 0, 0.85);
    }

    /* ========================================================
       AFTER EFFECTS MOTION GRAPHICS CINEMATIC UNLOCK SUITE
       ======================================================== */
    #ae-motion-suite {
      position: fixed;
      inset: 0;
      z-index: 200;
      pointer-events: none;
      opacity: 0;
      visibility: hidden;
      transition: opacity 0.3s ease, visibility 0.3s ease;
    }

    #ae-motion-suite.active {
      opacity: 1;
      visibility: visible;
      pointer-events: all;
    }

    /* 3D Hyperspace Warp Canvas */
    #ae-warp-canvas {
      position: absolute;
      inset: 0;
      width: 100vw;
      height: 100vh;
      z-index: 201;
    }

    /* Concentric Sonic Shockwave Rings */
    .ae-shockwave-ring {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%) scale(0);
      border-radius: 50%;
      pointer-events: none;
      z-index: 202;
      opacity: 0;
    }

    .ae-shockwave-ring.ring-1 {
      width: 100px;
      height: 100px;
      border: 3px solid rgba(255, 234, 121, 0.95);
      box-shadow: 0 0 40px #ffd700, inset 0 0 25px #ffd700;
    }

    .ae-shockwave-ring.ring-2 {
      width: 160px;
      height: 160px;
      border: 6px solid rgba(255, 215, 0, 0.8);
      filter: blur(4px);
    }

    .ae-shockwave-ring.ring-3 {
      width: 240px;
      height: 240px;
      border: 2px solid rgba(255, 255, 255, 0.9);
      box-shadow: 0 0 60px rgba(255, 255, 255, 0.8);
    }

    @keyframes aeShockwaveExpand {
      0% {
        transform: translate(-50%, -50%) scale(0.1);
        opacity: 1;
      }
      80% {
        opacity: 0.8;
      }
      100% {
        transform: translate(-50%, -50%) scale(22);
        opacity: 0;
      }
    }

    /* Anamorphic Golden Lens Flare Streak */
    .ae-anamorphic-flare {
      position: absolute;
      top: 50%;
      left: 0;
      right: 0;
      height: 3px;
      background: linear-gradient(90deg, transparent 0%, rgba(255, 215, 0, 0.3) 15%, #ffffff 50%, rgba(255, 215, 0, 0.3) 85%, transparent 100%);
      transform: translateY(-50%) scaleX(0);
      filter: drop-shadow(0 0 16px #ffd700);
      z-index: 204;
      opacity: 0;
    }

    @keyframes aeFlarePulse {
      0% { transform: translateY(-50%) scaleX(0); opacity: 0; }
      20% { transform: translateY(-50%) scaleX(1); opacity: 1; }
      80% { transform: translateY(-50%) scaleX(1.4); opacity: 0.9; }
      100% { transform: translateY(-50%) scaleX(2.2); opacity: 0; }
    }

    /* Volumetric Rotating God Rays */
    .ae-god-rays {
      position: absolute;
      top: 50%;
      left: 50%;
      width: 140vmax;
      height: 140vmax;
      transform: translate(-50%, -50%) rotate(0deg);
      background: conic-gradient(
        from 0deg,
        rgba(255, 215, 0, 0.18) 0deg 15deg,
        transparent 15deg 30deg,
        rgba(255, 215, 0, 0.22) 30deg 45deg,
        transparent 45deg 60deg,
        rgba(255, 215, 0, 0.16) 60deg 75deg,
        transparent 75deg 90deg,
        rgba(255, 215, 0, 0.22) 90deg 105deg,
        transparent 105deg 120deg,
        rgba(255, 215, 0, 0.18) 120deg 135deg,
        transparent 135deg 150deg,
        rgba(255, 215, 0, 0.22) 150deg 165deg,
        transparent 165deg 180deg,
        rgba(255, 215, 0, 0.18) 180deg 195deg,
        transparent 195deg 210deg,
        rgba(255, 215, 0, 0.22) 210deg 225deg,
        transparent 225deg 240deg,
        rgba(255, 215, 0, 0.18) 240deg 255deg,
        transparent 255deg 270deg,
        rgba(255, 215, 0, 0.22) 270deg 285deg,
        transparent 285deg 300deg,
        rgba(255, 215, 0, 0.18) 30deg 315deg,
        transparent 315deg 330deg,
        rgba(255, 215, 0, 0.22) 330deg 345deg,
        transparent 345deg 360deg
      );
      filter: blur(14px);
      z-index: 203;
      opacity: 0;
      mix-blend-mode: screen;
      pointer-events: none;
    }

    @keyframes aeGodRaysSpin {
      0% { transform: translate(-50%, -50%) rotate(0deg) scale(0.6); opacity: 0; }
      25% { opacity: 0.7; }
      80% { opacity: 0.9; }
      100% { transform: translate(-50%, -50%) rotate(120deg) scale(1.3); opacity: 0.2; }
    }

    /* Kinetic Typography Overlay */
    #ae-kinetic-overlay {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%) scale(0.7);
      text-align: center;
      z-index: 205;
      opacity: 0;
      pointer-events: none;
      width: 90%;
      max-width: 600px;
    }

    .ae-badge {
      display: inline-block;
      font-family: 'Cinzel', serif;
      font-size: 0.78rem;
      font-weight: 700;
      letter-spacing: 4px;
      color: #ffd700;
      background: rgba(18, 16, 12, 0.75);
      border: 1px solid rgba(255, 215, 0, 0.6);
      padding: 4px 16px;
      border-radius: 50px;
      margin-bottom: 0.6rem;
      box-shadow: 0 0 20px rgba(255, 215, 0, 0.4);
    }

    .ae-title {
      font-family: 'Cinzel', serif;
      font-size: 2.2rem;
      font-weight: 800;
      letter-spacing: 5px;
      color: #ffffff;
      text-shadow: 0 0 20px #ffd700, 0 0 40px #ffd700, 0 0 70px rgba(255, 215, 0, 0.6);
      margin-bottom: 0.4rem;
    }

    .ae-sub {
      font-family: 'Outfit', sans-serif;
      font-size: 1rem;
      font-weight: 600;
      letter-spacing: 2.5px;
      color: #ffea79;
      text-transform: uppercase;
      text-shadow: 0 0 14px rgba(255, 234, 121, 0.6);
    }

    @keyframes aeKineticPop {
      0% {
        transform: translate(-50%, -50%) scale(0.65);
        opacity: 0;
        filter: blur(8px);
      }
      25% {
        transform: translate(-50%, -50%) scale(1.05);
        opacity: 1;
        filter: blur(0);
      }
      70% {
        transform: translate(-50%, -50%) scale(1.0);
        opacity: 1;
        filter: blur(0);
      }
      100% {
        transform: translate(-50%, -50%) scale(1.4);
        opacity: 0;
        filter: blur(12px);
      }
    }

    /* Final Golden Supernova Void Veil (Seamless Reveal at 2.0s) */
    #ae-supernova-veil {
      position: absolute;
      inset: 0;
      background: radial-gradient(circle at 50% 50%, #ffffff 0%, #fff6cb 25%, #ffd700 60%, #060608 100%);
      opacity: 0;
      z-index: 206;
      pointer-events: none;
      transition: opacity 0.65s cubic-bezier(0.85, 0, 0.15, 1);
    }

    #ae-supernova-veil.bloom {
      opacity: 1;
    }

    @media (max-width: 768px) {
      .side-fairy-lights {
        display: none;
      }
      .lock-card {
        max-width: 310px;
        padding: 1.2rem 1rem 1rem;
      }
      .key-btn {
        width: 46px;
        height: 46px;
        font-size: 1.1rem;
      }
      .ae-title {
        font-size: 1.65rem;
        letter-spacing: 3px;
      }
      .ae-sub {
        font-size: 0.85rem;
      }
    }
  </style>
</head>

<body>

  <!-- Ambient Golden Nebula & Twinkling Starfield -->
  <canvas id="starfield-canvas"></canvas>
  <div class="cosmic-nebula-glow" aria-hidden="true"></div>

  <!-- Left & Right Cascading Golden Fairy Light Strings -->
  <aside class="side-fairy-lights left" aria-hidden="true">
    <svg class="fairy-string" viewBox="0 0 50 800" preserveAspectRatio="none">
      <path d="M 25 0 Q 35 200 20 400 T 25 800" stroke="rgba(245, 175, 45, 0.4)" stroke-width="1.5" fill="none"/>
      <circle cx="25" cy="90" r="5" fill="#ffd700" filter="drop-shadow(0 0 8px #ffd700)"/>
      <circle cx="32" cy="210" r="4.5" fill="#ffea79" filter="drop-shadow(0 0 8px #ffd700)"/>
      <circle cx="20" cy="360" r="5.5" fill="#ffd700" filter="drop-shadow(0 0 8px #ffd700)"/>
      <circle cx="28" cy="510" r="4.5" fill="#ffea79" filter="drop-shadow(0 0 8px #ffd700)"/>
      <circle cx="25" cy="680" r="5" fill="#ffd700" filter="drop-shadow(0 0 8px #ffd700)"/>
      <ellipse cx="28" cy="140" rx="4" ry="7" fill="rgba(74, 222, 128, 0.6)" transform="rotate(25 28 140)"/>
      <ellipse cx="19" cy="280" rx="4" ry="7" fill="rgba(74, 222, 128, 0.6)" transform="rotate(-30 19 280)"/>
      <ellipse cx="26" cy="430" rx="4" ry="7" fill="rgba(74, 222, 128, 0.6)" transform="rotate(20 26 430)"/>
    </svg>
  </aside>

  <aside class="side-fairy-lights right" aria-hidden="true">
    <svg class="fairy-string delay-1" viewBox="0 0 50 800" preserveAspectRatio="none">
      <path d="M 25 0 Q 15 250 30 500 T 25 800" stroke="rgba(245, 175, 45, 0.4)" stroke-width="1.5" fill="none"/>
      <circle cx="25" cy="110" r="5" fill="#ffd700" filter="drop-shadow(0 0 8px #ffd700)"/>
      <circle cx="20" cy="250" r="4.5" fill="#ffea79" filter="drop-shadow(0 0 8px #ffd700)"/>
      <circle cx="28" cy="400" r="5.5" fill="#ffd700" filter="drop-shadow(0 0 8px #ffd700)"/>
      <circle cx="22" cy="560" r="4.5" fill="#ffea79" filter="drop-shadow(0 0 8px #ffd700)"/>
      <circle cx="25" cy="710" r="5" fill="#ffd700" filter="drop-shadow(0 0 8px #ffd700)"/>
      <ellipse cx="20" cy="180" rx="4" ry="7" fill="rgba(74, 222, 128, 0.6)" transform="rotate(-20 20 180)"/>
      <ellipse cx="30" cy="330" rx="4" ry="7" fill="rgba(74, 222, 128, 0.6)" transform="rotate(35 30 330)"/>
      <ellipse cx="18" cy="480" rx="4" ry="7" fill="rgba(74, 222, 128, 0.6)" transform="rotate(-25 18 480)"/>
    </svg>
  </aside>

  <!-- Center Lock Card (Interactive 3D Tilt Stage) -->
  <main class="lock-stage">
    <div class="lock-card" id="lock-card">
      <div class="padlock-badge" id="padlock-icon">🔒</div>

      <div class="secret-subtitle">Secret Universe Entry</div>
      <h1 class="secret-question">When does the universe <span>whisper your wish?</span> 🌌</h1>

      <!-- Password Display -->
      <div class="password-display placeholder" id="password-display">-- : --</div>

      <!-- 3x4 Clickable Golden Keypad -->
      <div class="keypad-grid" id="keypad">
        <button type="button" class="key-btn" data-key="1">1</button>
        <button type="button" class="key-btn" data-key="2">2</button>
        <button type="button" class="key-btn" data-key="3">3</button>
        <button type="button" class="key-btn" data-key="4">4</button>
        <button type="button" class="key-btn" data-key="5">5</button>
        <button type="button" class="key-btn" data-key="6">6</button>
        <button type="button" class="key-btn" data-key="7">7</button>
        <button type="button" class="key-btn" data-key="8">8</button>
        <button type="button" class="key-btn" data-key="9">9</button>
        <button type="button" class="key-btn" data-key=":">:</button>
        <button type="button" class="key-btn" data-key="0">0</button>
        <button type="button" class="key-btn" data-key="back" aria-label="Backspace">⌫</button>
      </div>

      <!-- Hint Toggle & Box -->
      <button type="button" class="hint-toggle" id="hint-toggle">💡 Need a Hint?</button>
      <div class="hint-box" id="hint-box">
        ✨ Make a wish when all four digits on the clock align... <strong>(11:11)</strong>
      </div>

      <div class="status-msg" id="status-msg"></div>

      <button type="button" class="btn-unlock" id="btn-unlock">Unlock Surprise ✨</button>
    </div>
  </main>

  <!-- AFTER EFFECTS MOTION GRAPHICS CINEMATIC UNLOCK OVERLAY SUITE -->
  <div id="ae-motion-suite">
    <!-- 3D Hyperspace Warp Canvas -->
    <canvas id="ae-warp-canvas"></canvas>

    <!-- Concentric Shockwave Rings -->
    <div class="ae-shockwave-ring ring-1" id="shockwave-1"></div>
    <div class="ae-shockwave-ring ring-2" id="shockwave-2"></div>
    <div class="ae-shockwave-ring ring-3" id="shockwave-3"></div>

    <!-- Volumetric God Rays & Anamorphic Lens Flare -->
    <div class="ae-god-rays" id="ae-god-rays"></div>
    <div class="ae-anamorphic-flare" id="ae-flare"></div>

    <!-- Kinetic Typography Overlay -->
    <div id="ae-kinetic-overlay">
      <div class="ae-badge">✦ COSMIC GATE OPENED ✦</div>
      <div class="ae-title">11:11 • WISH GRANTED</div>
      <div class="ae-sub">ENTERING AKSHAYA'S CELEBRATION UNIVERSE ✨</div>
    </div>

    <!-- Golden Supernova Void Veil -->
    <div id="ae-supernova-veil"></div>
  </div>

  <script>
    // =========================================================================
    // 1. TWINKLING GOLDEN STARS & FALLING SHOOTING STAR CANVAS
    // =========================================================================
    const starCanvas = document.getElementById('starfield-canvas');
    const starCtx = starCanvas.getContext('2d');
    let stars = [];
    let shootingStar = null;

    function initStarfield() {
      starCanvas.width = window.innerWidth;
      starCanvas.height = window.innerHeight;
      stars = [];
      const numStars = Math.floor((starCanvas.width * starCanvas.height) / 5500);
      const goldShades = ['#ffd700', '#ffea79', '#fff4b8', '#f5af2d', '#ffffff'];

      for (let i = 0; i < numStars; i++) {
        stars.push({
          x: Math.random() * starCanvas.width,
          y: Math.random() * starCanvas.height,
          radius: 0.7 + Math.random() * 2.1,
          color: goldShades[Math.floor(Math.random() * goldShades.length)],
          alpha: Math.random(),
          twinkleSpeed: 0.012 + Math.random() * 0.025,
          twinkleDir: Math.random() > 0.5 ? 1 : -1,
          isCrossStar: Math.random() > 0.85
        });
      }
    }

    function spawnShootingStar() {
      shootingStar = {
        x: Math.random() * (starCanvas.width * 0.25),
        y: Math.random() * (starCanvas.height * 0.2),
        vx: 9 + Math.random() * 4,
        vy: 5.5 + Math.random() * 2.5,
        length: 130,
        alpha: 1.0
      };
    }

    function drawStarfield() {
      starCtx.clearRect(0, 0, starCanvas.width, starCanvas.height);

      for (const s of stars) {
        s.alpha += s.twinkleSpeed * s.twinkleDir;
        if (s.alpha >= 1) {
          s.alpha = 1;
          s.twinkleDir = -1;
        } else if (s.alpha <= 0.15) {
          s.alpha = 0.15;
          s.twinkleDir = 1;
        }

        starCtx.save();
        starCtx.globalAlpha = s.alpha;
        starCtx.fillStyle = s.color;
        starCtx.shadowColor = '#ffd700';
        starCtx.shadowBlur = s.isCrossStar ? 12 : 6;

        starCtx.beginPath();
        starCtx.arc(s.x, s.y, s.radius, 0, Math.PI * 2);
        starCtx.fill();

        if (s.isCrossStar && s.alpha > 0.65) {
          starCtx.strokeStyle = s.color;
          starCtx.lineWidth = 0.8;
          starCtx.beginPath();
          starCtx.moveTo(s.x - s.radius * 3, s.y);
          starCtx.lineTo(s.x + s.radius * 3, s.y);
          starCtx.moveTo(s.x, s.y - s.radius * 3);
          starCtx.lineTo(s.x, s.y + s.radius * 3);
          starCtx.stroke();
        }
        starCtx.restore();
      }

      if (shootingStar) {
        shootingStar.x += shootingStar.vx;
        shootingStar.y += shootingStar.vy;
        shootingStar.alpha -= 0.008;

        if (shootingStar.alpha > 0 && shootingStar.x < starCanvas.width + 150 && shootingStar.y < starCanvas.height + 150) {
          const tailX = shootingStar.x - shootingStar.vx * 14;
          const tailY = shootingStar.y - shootingStar.vy * 14;
          const grad = starCtx.createLinearGradient(shootingStar.x, shootingStar.y, tailX, tailY);
          grad.addColorStop(0, `rgba(255, 250, 205, ${shootingStar.alpha})`);
          grad.addColorStop(0.4, `rgba(255, 215, 0, ${shootingStar.alpha * 0.7})`);
          grad.addColorStop(1, 'rgba(255, 215, 0, 0)');

          starCtx.save();
          starCtx.strokeStyle = grad;
          starCtx.lineWidth = 2.6;
          starCtx.lineCap = 'round';
          starCtx.shadowColor = '#ffd700';
          starCtx.shadowBlur = 15;
          starCtx.beginPath();
          starCtx.moveTo(shootingStar.x, shootingStar.y);
          starCtx.lineTo(tailX, tailY);
          starCtx.stroke();

          starCtx.fillStyle = `rgba(255, 255, 255, ${shootingStar.alpha})`;
          starCtx.beginPath();
          starCtx.arc(shootingStar.x, shootingStar.y, 3, 0, Math.PI * 2);
          starCtx.fill();
          starCtx.restore();
        } else {
          shootingStar = null;
        }
      }

      requestAnimationFrame(drawStarfield);
    }

    window.addEventListener('resize', initStarfield);
    initStarfield();
    drawStarfield();
    setTimeout(spawnShootingStar, 900);
    setInterval(spawnShootingStar, 5500);

    // =========================================================================
    // 2. DEVELOPER-GRADE WEB AUDIO SYNTHESIZER (CLICKS, WRONG SOUND, UNLOCK SUITE)
    // =========================================================================
    let audioCtx = null;
    function getAudioContext() {
      if (!audioCtx) {
        const AudioClass = window.AudioContext || window.webkitAudioContext;
        audioCtx = new AudioClass();
      }
      if (audioCtx.state === 'suspended') audioCtx.resume();
      return audioCtx;
    }

    // Key click tone
    function playKeyTone(freq = 740, duration = 0.08) {
      try {
        const ctx = getAudioContext();
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(freq, ctx.currentTime);
        gain.gain.setValueAtTime(0.06, ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + duration);
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start();
        osc.stop(ctx.currentTime + duration);
      } catch (e) {}
    }

    // Rich Developer-Grade Sound for Wrong Password (Dissonant Tritone Fail Buzz + Sub Thud)
    function playWrongSound() {
      try {
        const ctx = getAudioContext();
        const now = ctx.currentTime;

        // Dual detuned saw/square oscillators (F#3 185Hz & C3 130Hz)
        const osc1 = ctx.createOscillator();
        const osc2 = ctx.createOscillator();
        const buzzGain = ctx.createGain();

        osc1.type = 'sawtooth';
        osc2.type = 'square';
        osc1.frequency.setValueAtTime(185, now);
        osc1.frequency.exponentialRampToValueAtTime(75, now + 0.35);
        osc2.frequency.setValueAtTime(130, now);
        osc2.frequency.exponentialRampToValueAtTime(60, now + 0.35);

        const filter = ctx.createBiquadFilter();
        filter.type = 'lowpass';
        filter.frequency.setValueAtTime(450, now);
        filter.frequency.exponentialRampToValueAtTime(110, now + 0.35);

        buzzGain.gain.setValueAtTime(0.24, now);
        buzzGain.gain.exponentialRampToValueAtTime(0.001, now + 0.38);

        osc1.connect(filter);
        osc2.connect(filter);
        filter.connect(buzzGain);
        buzzGain.connect(ctx.destination);

        osc1.start(now);
        osc2.start(now);
        osc1.stop(now + 0.38);
        osc2.stop(now + 0.38);

        // Low sub thud
        const thudOsc = ctx.createOscillator();
        const thudGain = ctx.createGain();
        thudOsc.type = 'sine';
        thudOsc.frequency.setValueAtTime(120, now);
        thudOsc.frequency.exponentialRampToValueAtTime(35, now + 0.3);
        thudGain.gain.setValueAtTime(0.32, now);
        thudGain.gain.exponentialRampToValueAtTime(0.001, now + 0.3);
        thudOsc.connect(thudGain);
        thudGain.connect(ctx.destination);
        thudOsc.start(now);
        thudOsc.stop(now + 0.32);
      } catch (e) {}
    }

    // Hollywood / After Effects Cinematic Unlock Sound Design
    function playCinematicUnlockSound() {
      try {
        const ctx = getAudioContext();
        const now = ctx.currentTime;

        // Sub-bass impact swoosh
        const subOsc = ctx.createOscillator();
        const subGain = ctx.createGain();
        subOsc.type = 'sine';
        subOsc.frequency.setValueAtTime(140, now);
        subOsc.frequency.exponentialRampToValueAtTime(32, now + 1.2);
        subGain.gain.setValueAtTime(0.45, now);
        subGain.gain.exponentialRampToValueAtTime(0.001, now + 1.2);
        subOsc.connect(subGain);
        subGain.connect(ctx.destination);
        subOsc.start(now);
        subOsc.stop(now + 1.3);

        // Crystalline golden chord arpeggio
        const chord = [523.25, 659.25, 783.99, 1046.50, 1318.51, 1567.98, 2093.00];
        chord.forEach((f, idx) => {
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          const startTime = now + idx * 0.085;
          osc.type = 'triangle';
          osc.frequency.setValueAtTime(f, startTime);
          gain.gain.setValueAtTime(0.12, startTime);
          gain.gain.exponentialRampToValueAtTime(0.0001, startTime + 1.4);
          osc.connect(gain);
          gain.connect(ctx.destination);
          osc.start(startTime);
          osc.stop(startTime + 1.5);
        });

        // Golden riser whoosh
        const bufferSize = ctx.sampleRate * 1.5;
        const noiseBuffer = ctx.createBuffer(1, bufferSize, ctx.sampleRate);
        const data = noiseBuffer.getChannelData(0);
        for (let i = 0; i < bufferSize; i++) {
          data[i] = (Math.random() * 2 - 1) * 0.22;
        }
        const noise = ctx.createBufferSource();
        noise.buffer = noiseBuffer;
        const bp = ctx.createBiquadFilter();
        bp.type = 'bandpass';
        bp.frequency.setValueAtTime(300, now + 0.3);
        bp.frequency.exponentialRampToValueAtTime(3400, now + 1.8);
        bp.Q.setValueAtTime(3.2, now + 0.3);
        const rGain = ctx.createGain();
        rGain.gain.setValueAtTime(0.01, now + 0.3);
        rGain.gain.linearRampToValueAtTime(0.2, now + 1.6);
        rGain.gain.exponentialRampToValueAtTime(0.0001, now + 1.95);
        noise.connect(bp);
        bp.connect(rGain);
        rGain.connect(ctx.destination);
        noise.start(now + 0.3);
        noise.stop(now + 1.98);
      } catch (e) {}
    }

    // =========================================================================
    // 3. 3D INTERACTIVE TILT EFFECT (DEVELOPER TOUCH)
    // =========================================================================
    const lockCard = document.getElementById('lock-card');
    const stage = document.querySelector('.lock-stage');
    let isUnlocked = false;

    stage.addEventListener('mousemove', (e) => {
      if (isUnlocked) return;
      const rect = lockCard.getBoundingClientRect();
      const x = e.clientX - rect.left - rect.width / 2;
      const y = e.clientY - rect.top - rect.height / 2;
      const rotX = (-y / rect.height) * 12;
      const rotY = (x / rect.width) * 12;
      lockCard.style.transform = `perspective(1000px) rotateX(${rotX.toFixed(2)}deg) rotateY(${rotY.toFixed(2)}deg) translateY(-2px)`;
    });

    stage.addEventListener('mouseleave', () => {
      if (isUnlocked) return;
      lockCard.style.transform = 'perspective(1000px) rotateX(0deg) rotateY(0deg) translateY(0)';
    });

    // =========================================================================
    // 4. KEYPAD LOGIC & AUTO-VERIFICATION
    // =========================================================================
    const displayEl = document.getElementById('password-display');
    const statusEl = document.getElementById('status-msg');
    const padlockIcon = document.getElementById('padlock-icon');
    const hintToggle = document.getElementById('hint-toggle');
    const hintBox = document.getElementById('hint-box');
    const unlockBtn = document.getElementById('btn-unlock');

    let enteredCode = '';

    function updateDisplay() {
      displayEl.classList.remove('error', 'success');
      statusEl.textContent = '';

      if (enteredCode.length === 0) {
        displayEl.textContent = '-- : --';
        displayEl.classList.add('placeholder');
      } else {
        displayEl.textContent = enteredCode;
        displayEl.classList.remove('placeholder');
      }
    }

    function handleKeyInput(key) {
      if (isUnlocked) return;

      if (key === 'back') {
        playKeyTone(420, 0.08);
        if (enteredCode.endsWith(':')) {
          enteredCode = enteredCode.slice(0, -2);
        } else {
          enteredCode = enteredCode.slice(0, -1);
        }
        updateDisplay();
        return;
      }

      if (enteredCode.length >= 5) return;
      playKeyTone(740, 0.08);

      if (key === ':') {
        if (!enteredCode.includes(':') && enteredCode.length > 0) {
          enteredCode += ':';
        }
      } else {
        if (enteredCode.length === 2 && !enteredCode.includes(':')) {
          enteredCode += ':' + key;
        } else {
          enteredCode += key;
        }
      }
      updateDisplay();

      // AUTO-VERIFY: When 4 digits are completed (e.g., "11:11"), automatically verify after 120ms!
      if (enteredCode.length === 5) {
        setTimeout(verifyPassword, 120);
      }
    }

    // Button click listeners
    document.querySelectorAll('.key-btn').forEach((btn) => {
      btn.addEventListener('click', () => {
        btn.classList.add('tap-flash');
        setTimeout(() => btn.classList.remove('tap-flash'), 160);
        handleKeyInput(btn.dataset.key);
      });
    });

    // Keyboard support
    window.addEventListener('keydown', (e) => {
      if (isUnlocked) return;
      if (e.key >= '0' && e.key <= '9') {
        handleKeyInput(e.key);
      } else if (e.key === ':') {
        handleKeyInput(':');
      } else if (e.key === 'Backspace') {
        handleKeyInput('back');
      } else if (e.key === 'Enter') {
        verifyPassword();
      }
    });

    hintToggle.addEventListener('click', () => {
      hintBox.classList.toggle('visible');
    });

    // =========================================================================
    // 5. AFTER EFFECTS 3D HYPERSPACE WARP ENGINE
    // =========================================================================
    const warpCanvas = document.getElementById('ae-warp-canvas');
    const warpCtx = warpCanvas.getContext('2d');
    let warpParticles = [];
    let isWarpRunning = false;
    let warpSpeed = 1.0;

    function initWarpEngine() {
      warpCanvas.width = window.innerWidth;
      warpCanvas.height = window.innerHeight;
      warpParticles = [];
      const numRays = 380;
      const colors = ['#ffffff', '#ffd700', '#ffea79', '#fff4b8', '#f5af2d'];

      for (let i = 0; i < numRays; i++) {
        const angle = Math.random() * Math.PI * 2;
        const dist = 5 + Math.random() * Math.min(warpCanvas.width, warpCanvas.height) * 0.45;
        warpParticles.push({
          x: Math.cos(angle) * dist,
          y: Math.sin(angle) * dist,
          z: Math.random() * 1000 + 100,
          prevZ: Math.random() * 1000 + 100,
          color: colors[Math.floor(Math.random() * colors.length)],
          size: 1 + Math.random() * 2.8,
          speedMult: 0.8 + Math.random() * 1.5
        });
      }
    }

    function renderWarpFrame() {
      if (!isWarpRunning) return;
      const cx = warpCanvas.width / 2;
      const cy = warpCanvas.height / 2;

      warpCtx.fillStyle = 'rgba(6, 6, 8, 0.22)';
      warpCtx.fillRect(0, 0, warpCanvas.width, warpCanvas.height);

      warpSpeed += 0.42; // Aggressive motion-graphics acceleration

      for (const p of warpParticles) {
        p.prevZ = p.z;
        p.z -= warpSpeed * p.speedMult;

        if (p.z <= 10) {
          p.z = 1000;
          p.prevZ = 1000;
        }

        const k = 450 / p.z;
        const px = cx + p.x * k;
        const py = cy + p.y * k;

        const prevK = 450 / p.prevZ;
        const prevPx = cx + p.x * prevK;
        const prevPy = cy + p.y * prevK;

        const alpha = Math.min(1, (1000 - p.z) / 450);

        warpCtx.save();
        warpCtx.strokeStyle = p.color;
        warpCtx.shadowColor = '#ffd700';
        warpCtx.shadowBlur = 10;
        warpCtx.lineWidth = Math.max(1, p.size * k * 0.8);
        warpCtx.globalAlpha = alpha;
        warpCtx.beginPath();
        warpCtx.moveTo(prevPx, prevPy);
        warpCtx.lineTo(px, py);
        warpCtx.stroke();
        warpCtx.restore();
      }

      requestAnimationFrame(renderWarpFrame);
    }

    // =========================================================================
    // 6. VERIFY PASSWORD & AFTER EFFECTS MOTION GRAPHICS UNLOCK SEQUENCE (2.0s)
    // =========================================================================
    function verifyPassword() {
      if (isUnlocked) return;

      const code = enteredCode.trim();
      const isCorrect = (code === '11:11' || code === '1111' || code.replace(':', '') === '1111');

      if (isCorrect) {
        isUnlocked = true;

        // Visual lock card success state
        displayEl.classList.remove('error');
        displayEl.classList.add('success');
        statusEl.style.color = '#4ade80';
        statusEl.textContent = '✨ 11:11 Verified! Unlocking Celebration Universe...';
        padlockIcon.textContent = '🔓';
        padlockIcon.classList.add('unlocked');
        lockCard.style.pointerEvents = 'none';

        // Play Hollywood Audio Design
        playCinematicUnlockSound();

        // 1. Lock Card AE Implosion Anticipation
        lockCard.style.transform = 'perspective(1000px) scale(0.92)';
        setTimeout(() => {
          lockCard.style.transition = 'transform 0.4s cubic-bezier(0.7, 0, 0.3, 1), opacity 0.35s ease';
          lockCard.style.transform = 'perspective(1000px) scale(0.05)';
          lockCard.style.opacity = '0';
        }, 120);

        // 2. Launch After Effects Motion Suite
        setTimeout(() => {
          const aeSuite = document.getElementById('ae-motion-suite');
          aeSuite.classList.add('active');

          // Start 3D Hyperspace Warp
          initWarpEngine();
          isWarpRunning = true;
          renderWarpFrame();

          // Trigger Shockwave Rings with staggered delays
          ['shockwave-1', 'shockwave-2', 'shockwave-3'].forEach((id, i) => {
            const el = document.getElementById(id);
            el.style.animation = `aeShockwaveExpand 1.6s cubic-bezier(0.1, 0.8, 0.2, 1) ${i * 0.12}s forwards`;
          });

          // Trigger Anamorphic Flare & God Rays
          document.getElementById('ae-flare').style.animation = 'aeFlarePulse 1.8s ease-in-out forwards';
          document.getElementById('ae-god-rays').style.animation = 'aeGodRaysSpin 2.0s linear forwards';

          // Trigger Kinetic Typography
          document.getElementById('ae-kinetic-overlay').style.animation = 'aeKineticPop 1.8s cubic-bezier(0.2, 0.8, 0.2, 1) forwards';
        }, 200);

        // 3. Bloom Golden Supernova Void Veil at t = 1.35s
        setTimeout(() => {
          document.getElementById('ae-supernova-veil').classList.add('bloom');
        }, 1350);

        // 4. Automatically navigate to Page 1 at EXACTLY 2.0 Seconds!
        setTimeout(() => {
          window.location.href = 'page1.html';
        }, 2000);

      } else {
        // WRONG PASSWORD: Rich Dissonant Tritone Sound + Glitch Shake
        playWrongSound();

        displayEl.classList.remove('success');
        displayEl.classList.add('error');
        statusEl.style.color = '#ff4d6d';
        statusEl.textContent = '⚠️ Sacred whispers say the magic time is (11:11)...';

        lockCard.classList.remove('error-shake');
        void lockCard.offsetWidth; // Reflow
        lockCard.classList.add('error-shake');

        // Auto-clear code after 750ms so user can immediately type again
        setTimeout(() => {
          lockCard.classList.remove('error-shake');
          displayEl.classList.remove('error');
          enteredCode = '';
          updateDisplay();
        }, 750);
      }
    }

    unlockBtn.addEventListener('click', verifyPassword);
  </script>
