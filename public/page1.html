  <script>
    // =========================================================================
    // NATURAL ACOUSTIC AUDIO ENGINE WITH CRISP FESTIVE FIRECRACKER SOUND
    // =========================================================================
    let audioCtx = null;

    function getAudioContext() {
      if (!audioCtx) {
        const AudioContextClass = window.AudioContext || window.webkitAudioContext;
        audioCtx = new AudioContextClass();
      }
      if (audioCtx.state === 'suspended') {
        audioCtx.resume();
      }
      return audioCtx;
    }

    // Helper: Natural acoustic bell note
    function playAcousticNote(freq, startTime, duration = 1.6, volume = 0.08) {
      if (!audioCtx) return;
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();

      osc.type = 'sine';
      osc.frequency.setValueAtTime(freq, startTime);

      gain.gain.setValueAtTime(0, startTime);
      gain.gain.linearRampToValueAtTime(volume, startTime + 0.02);
      gain.gain.exponentialRampToValueAtTime(0.0001, startTime + duration);

      osc.connect(gain);
      gain.connect(audioCtx.destination);

      osc.start(startTime);
      osc.stop(startTime + duration + 0.1);
    }

    // 1. Anticipation Sound when button is clicked (Rapid chime arpeggio + rising warm chord)
    function playAnticipationChimes() {
      try {
        const ctx = getAudioContext();
        const now = ctx.currentTime;

        // Rising golden chime notes
        const notes = [523.25, 659.25, 783.99, 1046.50, 1318.51, 1567.98, 2093.00];
        let delay = 0;
        notes.forEach((f) => {
          setTimeout(() => {
            if (audioCtx) playAcousticNote(f, audioCtx.currentTime, 1.2, 0.09);
          }, delay * 1000);
          delay += 0.13;
        });
      } catch (err) {}
    }

    // 2. FESTIVE FIRECRACKER BLAST SOUND (Crisp Pop + Crackling Sparks + Chime Sparkle)
    window.onFirecrackerBlast = function() {
      try {
        const ctx = getAudioContext();
        const now = ctx.currentTime;

        // A. Primary Firecracker Pop / Thump (Punchy low impact)
        const popOsc = ctx.createOscillator();
        const popGain = ctx.createGain();
        popOsc.type = 'sine';
        popOsc.frequency.setValueAtTime(160, now);
        popOsc.frequency.exponentialRampToValueAtTime(30, now + 0.35);

        popGain.gain.setValueAtTime(0.4, now);
        popGain.gain.exponentialRampToValueAtTime(0.001, now + 0.4);

        popOsc.connect(popGain);
        popGain.connect(ctx.destination);
        popOsc.start(now);
        popOsc.stop(now + 0.45);

        // B. Crisp Crackling Sparks (Synthesized sparkler sizzle & pops)
        const bufferSize = ctx.sampleRate * 0.75;
        const noiseBuffer = ctx.createBuffer(1, bufferSize, ctx.sampleRate);
        const data = noiseBuffer.getChannelData(0);
        for (let i = 0; i < bufferSize; i++) {
          // Randomized crackle impulses
          data[i] = (Math.random() > 0.88 ? (Math.random() * 2 - 1) : 0) * 0.8;
        }

        const crackleSource = ctx.createBufferSource();
        crackleSource.buffer = noiseBuffer;

        const crackleFilter = ctx.createBiquadFilter();
        crackleFilter.type = 'highpass';
        crackleFilter.frequency.setValueAtTime(1800, now);

        const crackleGain = ctx.createGain();
        crackleGain.gain.setValueAtTime(0.35, now);
        crackleGain.gain.exponentialRampToValueAtTime(0.001, now + 0.75);

        crackleSource.connect(crackleFilter);
        crackleFilter.connect(crackleGain);
        crackleGain.connect(ctx.destination);
        crackleSource.start(now);

        // C. Celebratory High-Pitched Golden Shimmer Fanfare
        const goldenChimes = [1046.50, 1318.51, 1567.98, 2093.00, 2637.02, 3135.96];
        goldenChimes.forEach((freq, idx) => {
          setTimeout(() => {
            if (audioCtx) playAcousticNote(freq, audioCtx.currentTime, 1.8, 0.12);
          }, idx * 30);
        });
      } catch (err) {}
    };

    // =========================================================================
    // BUTTON EVENT LISTENER
    // =========================================================================
    window.addEventListener('DOMContentLoaded', () => {
      const surpriseBtn = document.getElementById('btn-surprise');

      // Pop up smoothly 1 second after page load
      setTimeout(() => {
        if (surpriseBtn) {
          surpriseBtn.classList.add('show-btn');
        }
      }, 1000);

      // On button click: All butterflies fly together -> Blast like firecracker -> Next page!
      if (surpriseBtn) {
        surpriseBtn.addEventListener('click', (e) => {
          e.preventDefault();

          // Disable button
          surpriseBtn.style.pointerEvents = 'none';
          surpriseBtn.style.opacity = '0.6';

          // Play anticipation chimes
          playAnticipationChimes();

          // Trigger converge & firecracker blast
          if (window.butterflySim) {
            window.butterflySim.triggerSurpriseTransition(() => {
              window.location.href = 'page2.html';
            });
          } else {
            setTimeout(() => {
              window.location.href = 'page2.html';
            }, 2800);
          }
        });
      }
    });
