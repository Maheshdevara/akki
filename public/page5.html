<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Akshaya's Wish Tree ✨</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🌳</text></svg>" />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Fredoka:wght@600;700&family=Outfit:wght@400;500;600;700&family=Playfair+Display:ital,wght@0,600;1,600&display=swap" />
  <style>
    :root {
      --bg-black: #080808;
      --gold-neon: #ffd700;
      --gold-warm: #f5af2d;
      --gold-bright: #ffea79;
      --text-white: #ffffff;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      width: 100%;
      height: 100%;
      background-color: var(--bg-black);
      color: var(--text-white);
      font-family: 'Outfit', -apple-system, BlinkMacSystemFont, sans-serif;
      overflow: hidden;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    /* ========================================================
       3D WEBGL CANVAS CONTAINER
       ======================================================== */
    #tree-3d-container {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
      z-index: 1;
      cursor: grab;
    }

    #tree-3d-container:active {
      cursor: grabbing;
    }

    /* Atmospheric Radial Vignette */
    .nature-vignette {
      position: fixed;
      inset: 0;
      z-index: 2;
      pointer-events: none;
      background: radial-gradient(circle at 50% 45%, transparent 38%, rgba(5, 5, 7, 0.86) 100%);
    }

    /* ========================================================
       MATCHING SIDE GOLDEN FAIRY LIGHTS
       ======================================================== */
    .side-fairy-lights {
      position: fixed;
      top: -15px;
      bottom: 0;
      width: 20vw;
      z-index: 3;
      pointer-events: none;
      display: flex;
      justify-content: space-evenly;
      filter: blur(1px);
      opacity: 0.9;
    }

    .side-fairy-lights.left {
      left: 0;
      mask-image: linear-gradient(to right, rgba(0,0,0,1) 50%, rgba(0,0,0,0) 100%);
      -webkit-mask-image: linear-gradient(to right, rgba(0,0,0,1) 50%, rgba(0,0,0,0) 100%);
    }

    .side-fairy-lights.right {
      right: 0;
      mask-image: linear-gradient(to left, rgba(0,0,0,1) 50%, rgba(0,0,0,0) 100%);
      -webkit-mask-image: linear-gradient(to left, rgba(0,0,0,1) 50%, rgba(0,0,0,0) 100%);
    }

    .fairy-string {
      height: 75vh;
      width: 55px;
      transform-origin: top center;
      animation: swayBreeze 6s ease-in-out infinite alternate;
    }

    .fairy-string.delay {
      height: 62vh;
      animation-delay: -2.5s;
    }

    @keyframes swayBreeze {
      0% { transform: rotate(-2deg); }
      100% { transform: rotate(2deg); }
    }

    /* ========================================================
       TOP NAVIGATION & HEADER
       ======================================================== */
    .top-bar {
      position: fixed;
      top: 18px;
      left: 20px;
      right: 20px;
      z-index: 20;
      display: flex;
      align-items: center;
      justify-content: space-between;
      pointer-events: none;
    }

    .nav-pill {
      pointer-events: auto;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 8px 18px;
      border-radius: 50px;
      background: rgba(14, 14, 18, 0.78);
      border: 1.5px solid rgba(255, 215, 0, 0.45);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      color: var(--gold-bright);
      text-decoration: none;
      font-size: 0.86rem;
      font-weight: 600;
      box-shadow: 0 0 18px rgba(255, 215, 0, 0.2);
      transition: all 0.25s ease;
    }

    .nav-pill:hover {
      border-color: var(--gold-neon);
      background: rgba(255, 215, 0, 0.16);
      transform: translateY(-1px);
    }

    .page-title-badge {
      padding: 8px 24px;
      border-radius: 50px;
      background: rgba(14, 14, 18, 0.78);
      border: 1.5px solid rgba(255, 215, 0, 0.55);
      backdrop-filter: blur(12px);
      font-family: 'Playfair Display', serif;
      font-size: 1rem;
      font-weight: 600;
      letter-spacing: 0.6px;
      color: var(--gold-bright);
      box-shadow: 0 0 24px rgba(255, 215, 0, 0.28);
    }

    .bloom-counter {
      pointer-events: auto;
      padding: 8px 16px;
      border-radius: 50px;
      background: rgba(14, 14, 18, 0.78);
      border: 1px solid rgba(255, 215, 0, 0.45);
      backdrop-filter: blur(12px);
      font-size: 0.84rem;
      font-weight: 600;
      color: #fff3b0;
    }

    /* ========================================================
       FLOATING WISH CARD & ACTION BUTTON
       ======================================================== */
    .hud-bottom {
      position: fixed;
      bottom: 18px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 20;
      width: min(92vw, 600px);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
      text-align: center;
      pointer-events: none;
    }

    .wish-reveal-card {
      width: 100%;
      padding: 1.05rem 1.6rem;
      border-radius: 20px;
      background: linear-gradient(145deg, rgba(22, 19, 24, 0.86), rgba(10, 10, 14, 0.92));
      border: 1.5px solid rgba(255, 215, 0, 0.55);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      box-shadow:
        0 0 35px rgba(255, 215, 0, 0.25),
        inset 0 0 18px rgba(255, 215, 0, 0.08);
      transition: all 0.45s cubic-bezier(0.2, 0.8, 0.2, 1);
    }

    .wish-reveal-card.pop {
      animation: wishCardPop 0.55s cubic-bezier(0.2, 0.9, 0.3, 1.15);
    }

    @keyframes wishCardPop {
      0% { transform: scale(0.92) translateY(8px); opacity: 0.5; }
      60% { transform: scale(1.03) translateY(-2px); opacity: 1; }
      100% { transform: scale(1) translateY(0); opacity: 1; }
    }

    .wish-step-label {
      font-family: 'Cinzel', serif;
      font-size: 0.82rem;
      font-weight: 700;
      letter-spacing: 2px;
      color: var(--gold-bright);
      text-transform: uppercase;
      margin-bottom: 0.35rem;
      text-shadow: 0 0 12px rgba(255, 215, 0, 0.5);
    }

    .wish-text {
      font-family: 'Playfair Display', serif;
      font-size: clamp(1.05rem, 2.2vw, 1.32rem);
      line-height: 1.48;
      color: #ffffff;
      text-shadow: 0 2px 12px rgba(0, 0, 0, 0.95), 0 0 18px rgba(255, 215, 0, 0.35);
    }

    /* Final Full-Bloom Grand Message Styling */
    .wish-reveal-card.finale {
      padding: 1.3rem 1.8rem;
      border: 1.8px solid #ffd700;
      background: linear-gradient(145deg, rgba(32, 24, 12, 0.9), rgba(12, 10, 14, 0.94));
      box-shadow:
        0 0 50px rgba(255, 215, 0, 0.5),
        inset 0 0 22px rgba(255, 215, 0, 0.18);
    }

    /* Make a Wish / Shower Golden Petals Button */
    .btn-make-wish {
      pointer-events: auto;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 12px 32px;
      border-radius: 50px;
      border: 1.5px solid #fff3b0;
      background: linear-gradient(135deg, #f5af2d 0%, #ffea79 50%, #e09f1f 100%);
      color: #141008;
      font-family: 'Playfair Display', serif;
      font-size: 1.05rem;
      font-weight: 700;
      letter-spacing: 0.4px;
      cursor: pointer;
      box-shadow: 0 0 28px rgba(255, 215, 0, 0.55), 0 8px 22px rgba(0, 0, 0, 0.85);
      transition: all 0.28s ease;
    }

    .btn-make-wish:hover {
      transform: translateY(-2px) scale(1.05);
      background: #ffffff;
      box-shadow: 0 0 40px rgba(255, 215, 0, 0.9);
    }

    .btn-make-wish:active {
      transform: scale(0.96);
    }

    .drag-hint {
      font-size: 0.76rem;
      color: rgba(255, 234, 121, 0.72);
      letter-spacing: 0.3px;
    }

    @media (max-width: 768px) {
      .side-fairy-lights { display: none; }
      .page-title-badge { display: none; }
      .top-bar { top: 12px; left: 12px; right: 12px; }
      .hud-bottom { bottom: 14px; }
      .btn-make-wish { padding: 10px 24px; font-size: 0.96rem; }
    }
  </style>
</head>
<body>

  <!-- Interactive 3D Nature Scene -->
  <div id="tree-3d-container"></div>
  <div class="nature-vignette"></div>

  <!-- Left & Right Golden Fairy Light Strings -->
  <aside class="side-fairy-lights left" aria-hidden="true">
    <svg class="fairy-string" viewBox="0 0 50 800" preserveAspectRatio="none">
      <path d="M 25 0 Q 35 200 20 400 T 25 800" stroke="rgba(245, 175, 45, 0.4)" stroke-width="1.5" fill="none"/>
      <circle cx="25" cy="90" r="5" fill="#ffd700" filter="drop-shadow(0 0 8px #ffd700)"/>
      <circle cx="32" cy="210" r="4.5" fill="#ffea79" filter="drop-shadow(0 0 8px #ffd700)"/>
      <circle cx="20" cy="360" r="5.5" fill="#ffd700" filter="drop-shadow(0 0 8px #ffd700)"/>
      <circle cx="28" cy="510" r="4.5" fill="#ffea79" filter="drop-shadow(0 0 8px #ffd700)"/>
      <circle cx="25" cy="680" r="5" fill="#ffd700" filter="drop-shadow(0 0 8px #ffd700)"/>

  <aside class="side-fairy-lights right" aria-hidden="true">
    <svg class="fairy-string delay" viewBox="0 0 50 800" preserveAspectRatio="none">
      <path d="M 25 0 Q 15 250 30 500 T 25 800" stroke="rgba(245, 175, 45, 0.4)" stroke-width="1.5" fill="none"/>
      <circle cx="25" cy="110" r="5" fill="#ffd700" filter="drop-shadow(0 0 8px #ffd700)"/>
      <circle cx="20" cy="250" r="4.5" fill="#ffea79" filter="drop-shadow(0 0 8px #ffd700)"/>
      <circle cx="28" cy="400" r="5.5" fill="#ffd700" filter="drop-shadow(0 0 8px #ffd700)"/>
      <circle cx="22" cy="560" r="4.5" fill="#ffea79" filter="drop-shadow(0 0 8px #ffd700)"/>
      <circle cx="25" cy="710" r="5" fill="#ffd700" filter="drop-shadow(0 0 8px #ffd700)"/>
      <ellipse cx="20" cy="180" rx="4" ry="7" fill="rgba(74, 222, 128, 0.65)" transform="rotate(-20 20 180)"/>
      <ellipse cx="30" cy="330" rx="4" ry="7" fill="rgba(74, 222, 128, 0.65)" transform="rotate(35 30 330)"/>
      <ellipse cx="18" cy="480" rx="4" ry="7" fill="rgba(74, 222, 128, 0.65)" transform="rotate(-25 18 480)"/>
    </svg>
  </aside>

  <!-- Top Navigation Linked to Page 4 -->
  <header class="top-bar">
    <a href="page4.html" class="nav-pill">← Back to Page 4</a>
    <div class="page-title-badge">🌳 Akshaya's Wish Tree ✨</div>
    <div class="bloom-counter" id="bloom-counter">🌸 0 / 11 Bloomed</div>
  </header>

  <!-- Bottom Interactive Wish Card & Button -->
  <div class="hud-bottom">
    <div class="wish-reveal-card" id="wish-card">
      <div class="wish-step-label" id="wish-step-label">✨ Bare Branches Await ✨</div>
      <p class="wish-text" id="wish-text">
        Click “Make a Wish” to slowly bloom each branch with flowers and wishes for you...
      </p>
    </div>

    <button type="button" class="btn-make-wish" id="btn-make-wish">
      <span>Make a Wish 🌸</span>
    </button>
    <div class="drag-hint">✨ Drag anywhere to rotate the 3D tree in full nature view</div>
  </div>

  <!-- Three.js CDN -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script>
    // =========================================================================
    // 1. ALL WISHES + FULL-BLOOM FINALE MESSAGE
    // =========================================================================
    const wishes = [
      "May you never doubt your worth.",
      "May the things you silently pray for find their way to you.",
      "May this year bring you peace you don't have to fight for.",
      "May you always have reasons to smile, even on ordinary days.",
      "Never doubt your worth.",
      "Smiles even on ordinary days.",
      "Effortless joy in every step.",
      "Every closed door leading to magic.",
      "May your silent prayers find you.",
      "A year as radiant as your soul.",
      "May your silent wishes manifest fast."
    ];

    const finalTreeMessage =
      "“May this year be as beautiful as the happiness you bring into the lives of others.” ✨";

    let currentWishIndex = 0;
    let isTreeFullyBloomed = false;

    // =========================================================================
    // 2. ACOUSTIC HARP & FINALE CHIME SYNTHESIS
    // =========================================================================
    let audioCtx = null;
    function getAudioContext() {
      if (!audioCtx) {
        const AudioClass = window.AudioContext || window.webkitAudioContext;
        audioCtx = new AudioClass();
      }
      if (audioCtx.state === 'suspended') audioCtx.resume();
      return audioCtx;
    }

    function playBloomChime(index) {
      try {
        const ctx = getAudioContext();
        const pentatonic = [523.25, 587.33, 659.25, 783.99, 880.0, 1046.5, 1174.66, 1318.5];
        const baseFreq = pentatonic[index % pentatonic.length];
        const now = ctx.currentTime;

        [baseFreq, baseFreq * 1.5].forEach((freq, i) => {
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          osc.type = 'sine';
          osc.frequency.setValueAtTime(freq, now + i * 0.06);
          gain.gain.setValueAtTime(0.08, now + i * 0.06);
          gain.gain.exponentialRampToValueAtTime(0.0001, now + i * 0.06 + 1.1);
          osc.connect(gain);
          gain.connect(ctx.destination);
          osc.start(now + i * 0.06);
          osc.stop(now + i * 0.06 + 1.15);
        });
      } catch (e) {}
    }

    function playFinaleFanfare() {
      try {
        const ctx = getAudioContext();
        const now = ctx.currentTime;
        const chord = [523.25, 659.25, 783.99, 1046.5, 1318.5, 1567.98];
        chord.forEach((freq, idx) => {
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          osc.type = 'triangle';
          osc.frequency.setValueAtTime(freq, now + idx * 0.09);
          gain.gain.setValueAtTime(0.09, now + idx * 0.09);
          gain.gain.exponentialRampToValueAtTime(0.0001, now + idx * 0.09 + 1.8);
          osc.connect(gain);
          gain.connect(ctx.destination);
          osc.start(now + idx * 0.09);
          osc.stop(now + idx * 0.09 + 1.85);
        });
      } catch (e) {}
    }

    // =========================================================================
    // 3. THREE.JS 3D NATURE SCENE (EMPTY BRANCHES -> BLOOMING CANOPY + BIRDS)
    // =========================================================================
    const container = document.getElementById('tree-3d-container');
    const scene = new THREE.Scene();
    scene.fog = new THREE.FogExp2(0x080808, 0.03);

    const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 100);
    camera.position.set(0, 3.6, 12.2);
    camera.lookAt(0, 3.0, 0);

    const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.25;
    container.appendChild(renderer.domElement);

    // Warm Golden & Moonlight Nature Lighting
    const ambientLight = new THREE.AmbientLight(0x2a2418, 1.45);
    scene.add(ambientLight);

    const moonLight = new THREE.DirectionalLight(0xfff1c1, 1.85);
    moonLight.position.set(6, 12, 8);
    scene.add(moonLight);

    const rimLight = new THREE.DirectionalLight(0xffb703, 1.15);
    rimLight.position.set(-7, 6, -6);
    scene.add(rimLight);

    const canopyGlowLight = new THREE.PointLight(0xffd700, 1.1, 16);
    canopyGlowLight.position.set(0, 4.2, 0);
    scene.add(canopyGlowLight);

    // Master Tree Group (rotatable by user drag)
    const treeGroup = new THREE.Group();
    scene.add(treeGroup);

    // Swaying Canopy Pivot Group (so branches & bloomed flowers sway together in breeze)
    const canopySwayGroup = new THREE.Group();
    canopySwayGroup.position.set(0, 2.2, 0);
    treeGroup.add(canopySwayGroup);

    // Mossy Earth Mound at Base
    const groundGeo = new THREE.CylinderGeometry(3.8, 4.6, 0.35, 48);
    const groundMat = new THREE.MeshStandardMaterial({
      color: 0x161f12,
      roughness: 0.9,
      metalness: 0.05
    });
    const groundMesh = new THREE.Mesh(groundGeo, groundMat);
    groundMesh.position.y = -0.15;
    treeGroup.add(groundMesh);

    // Glowing Golden Ring around Mound
    const ringGeo = new THREE.RingGeometry(3.75, 3.86, 64);
    const ringMat = new THREE.MeshBasicMaterial({
      color: 0xffd700,
      side: THREE.DoubleSide,
      transparent: true,
      opacity: 0.35
    });
    const ringMesh = new THREE.Mesh(ringGeo, ringMat);
    ringMesh.rotation.x = -Math.PI / 2;
    ringMesh.position.y = 0.03;
    treeGroup.add(ringMesh);

    // Wood Bark Material
    const barkMaterial = new THREE.MeshStandardMaterial({
      color: 0x3f2a1d,
      roughness: 0.88,
      metalness: 0.08
    });

    // Helper: Build Organic Tapered 3D Branch
    function createTaperedBranch(targetParent, points, radiusBottom, radiusTop, tubularSegments = 20, radialSegments = 10) {
      const curve = new THREE.CatmullRomCurve3(points);
      const geometry = new THREE.TubeGeometry(curve, tubularSegments, 1, radialSegments, false);
      const pos = geometry.attributes.position;
      const v = new THREE.Vector3();
      const center = new THREE.Vector3();

      for (let i = 0; i <= tubularSegments; i++) {
        const t = i / tubularSegments;
        curve.getPointAt(t, center);
        const radius = radiusBottom * (1 - t) + radiusTop * t;

        for (let j = 0; j <= radialSegments; j++) {
          const idx = i * (radialSegments + 1) + j;
          v.fromBufferAttribute(pos, idx);
          v.sub(center).multiplyScalar(radius).add(center);
          pos.setXYZ(idx, v.x, v.y, v.z);
        }
      }
      geometry.computeVertexNormals();
      const mesh = new THREE.Mesh(geometry, barkMaterial);
      targetParent.add(mesh);
      return curve;
    }

    // Main Trunk
    createTaperedBranch(
      treeGroup,
      [
        new THREE.Vector3(0, 0, 0),
        new THREE.Vector3(-0.15, 1.1, 0.1),
        new THREE.Vector3(0.08, 2.25, -0.05)
      ],
      0.42, 0.22, 22, 12
    );

    // Gnarled Roots
    const rootAngles = [0, 1.3, 2.5, 3.9, 5.1];
    rootAngles.forEach((ang) => {
      createTaperedBranch(
        treeGroup,
        [
          new THREE.Vector3(Math.cos(ang) * 0.18, 0.55, Math.sin(ang) * 0.18),
          new THREE.Vector3(Math.cos(ang) * 0.65, 0.15, Math.sin(ang) * 0.65),
          new THREE.Vector3(Math.cos(ang) * 1.15, -0.02, Math.sin(ang) * 1.15)
        ],
        0.16, 0.04, 10, 7
      );
    });

    // Upper Trunk Continuation inside canopySwayGroup (relative to y = 2.2)
    createTaperedBranch(
      canopySwayGroup,
      [
        new THREE.Vector3(0.08, 0.0, -0.05),
        new THREE.Vector3(0, 0.9, 0)
      ],
      0.22, 0.15, 12, 10
    );

    // 11 Empty Branches with Blossom Cluster Points (Starts completely bare!)
    const branchSpecs = [
      { pts: [[0, 0.1, 0], [-1.1, 0.6, 0.5], [-2.2, 1.1, 0.9]], r1: 0.14, r2: 0.03 },
      { pts: [[0, 0.2, 0], [1.1, 0.7, 0.4], [2.25, 1.2, 0.75]], r1: 0.14, r2: 0.03 },
      { pts: [[0, 0.4, 0], [-0.9, 1.1, -0.8], [-1.85, 1.75, -1.4]], r1: 0.13, r2: 0.03 },
      { pts: [[0, 0.5, 0], [0.95, 1.2, -0.75], [1.95, 1.85, -1.25]], r1: 0.13, r2: 0.03 },
      { pts: [[0, 0.7, 0], [-1.35, 1.6, -0.1], [-2.45, 2.25, -0.2]], r1: 0.12, r2: 0.025 },
      { pts: [[0, 0.75, 0], [1.3, 1.65, 0.15], [2.4, 2.3, 0.25]], r1: 0.12, r2: 0.025 },
      { pts: [[0, 0.8, 0], [-0.45, 1.7, 1.1], [-0.85, 2.55, 1.85]], r1: 0.11, r2: 0.025 },
      { pts: [[0, 0.85, 0], [0.55, 1.75, 1.05], [0.95, 2.6, 1.75]], r1: 0.11, r2: 0.025 },
      { pts: [[0, 0.85, 0], [-0.65, 1.9, -0.95], [-1.1, 2.85, -1.55]], r1: 0.10, r2: 0.025 },
      { pts: [[0, 0.88, 0], [0.7, 1.95, -0.9], [1.15, 2.9, -1.45]], r1: 0.10, r2: 0.025 },
      { pts: [[0, 0.9, 0], [-0.1, 2.1, 0.1], [0.05, 3.25, 0.05]], r1: 0.11, r2: 0.03 }
    ];

    const branchCurves = [];
    branchSpecs.forEach((b) => {
      const vecs = b.pts.map((p) => new THREE.Vector3(p[0], p[1], p[2]));
      const curve = createTaperedBranch(canopySwayGroup, vecs, b.r1, b.r2, 16, 8);
      branchCurves.push(curve);
    });

    // =========================================================================
    // 4. 3D BLOOMING FLOWERS BUILDER (BLOOMS CLUSTER ON EACH CLICK)
    // =========================================================================
    const activeFlowers = [];
    const fallingPetals = [];

    function create3DFlower(position, isGolden = false) {
      const flower = new THREE.Group();
      flower.position.copy(position);

      const petalGeo = new THREE.SphereGeometry(0.16, 12, 10);
      petalGeo.scale(0.65, 0.22, 1.45);

      const petalMat = new THREE.MeshStandardMaterial({
        color: isGolden ? 0xffd700 : 0xffb3c6,
        emissive: isGolden ? 0xffaa00 : 0xff6b8b,
        emissiveIntensity: 0.48,
        roughness: 0.3,
        metalness: 0.2
      });

      const petalCount = 6;
      for (let i = 0; i < petalCount; i++) {
        const angle = (i / petalCount) * Math.PI * 2;
        const petal = new THREE.Mesh(petalGeo, petalMat);
        petal.position.set(Math.cos(angle) * 0.15, 0.03, Math.sin(angle) * 0.15);
        petal.rotation.y = -angle + Math.PI / 2;
        petal.rotation.x = 0.28;
        flower.add(petal);
      }

      // Glowing Golden Stamen Core
      const coreGeo = new THREE.SphereGeometry(0.08, 12, 12);
      const coreMat = new THREE.MeshBasicMaterial({ color: 0xfff3b0 });
      const core = new THREE.Mesh(coreGeo, coreMat);
      core.position.y = 0.05;
      flower.add(core);

      flower.scale.set(0.01, 0.01, 0.01);
      flower.userData = { targetScale: isGolden ? 0.95 : 1.32, currentScale: 0.01 };
      canopySwayGroup.add(flower);
      activeFlowers.push(flower);

      // Spawn drifting petals from the newly bloomed blossom
      for (let i = 0; i < 6; i++) {
        const pMesh = new THREE.Mesh(
          new THREE.CircleGeometry(0.06, 6),
          new THREE.MeshBasicMaterial({
            color: Math.random() > 0.4 ? 0xffd700 : 0xffb3c6,
            side: THREE.DoubleSide,
            transparent: true,
            opacity: 0.9
          })
        );
        pMesh.position.set(position.x, position.y + 2.2, position.z);
        pMesh.userData = {
          vx: (Math.random() - 0.5) * 0.035,
          vy: -0.01 - Math.random() * 0.018,
          vz: (Math.random() - 0.5) * 0.035,
          rotSpeed: (Math.random() - 0.5) * 0.08
        };
        treeGroup.add(pMesh);
        fallingPetals.push(pMesh);
      }
    }

    function bloomBranchCluster(branchIndex) {
      const curve = branchCurves[branchIndex];
      // Bloom 5 flowers along the upper half and tip of the branch
      const positions = [0.55, 0.72, 0.85, 0.95, 1.0];
      positions.forEach((t, idx) => {
        const pt = curve.getPointAt(t);
        const offset = new THREE.Vector3(
          (Math.random() - 0.5) * 0.35,
          (Math.random() - 0.5) * 0.25,
          (Math.random() - 0.5) * 0.35
        );
        setTimeout(() => {
          create3DFlower(pt.clone().add(offset), idx % 2 === 1);
        }, idx * 70);
      });
    }

    // =========================================================================
    // 5. ANIMATED 3D GOLDEN BIRDS FLYING AROUND THE TREE
    // =========================================================================
    const birds = [];

    function create3DBird(orbitRadius, heightOffset, speed, phase) {
      const bird = new THREE.Group();

      const bodyMat = new THREE.MeshStandardMaterial({
        color: 0xffd700,
        emissive: 0xd97706,
        emissiveIntensity: 0.45,
        roughness: 0.3
      });

      const bodyGeo = new THREE.ConeGeometry(0.07, 0.26, 8);
      bodyGeo.rotateX(Math.PI / 2);
      const body = new THREE.Mesh(bodyGeo, bodyMat);
      bird.add(body);

      const wingGeo = new THREE.PlaneGeometry(0.24, 0.11);
      const wingMat = new THREE.MeshStandardMaterial({
        color: 0xffea79,
        emissive: 0xffb703,
        emissiveIntensity: 0.4,
        side: THREE.DoubleSide
      });

      const leftWingPivot = new THREE.Group();
      const leftWing = new THREE.Mesh(wingGeo, wingMat);
      leftWing.position.x = -0.12;
      leftWingPivot.add(leftWing);
      bird.add(leftWingPivot);

      const rightWingPivot = new THREE.Group();
      const rightWing = new THREE.Mesh(wingGeo, wingMat);
      rightWing.position.x = 0.12;
      rightWingPivot.add(rightWing);
      bird.add(rightWingPivot);

      bird.userData = {
        orbitRadius,
        heightOffset,
        speed,
        phase,
        leftWingPivot,
        rightWingPivot,
        flapSpeed: 11 + Math.random() * 4
      };

      scene.add(bird);
      birds.push(bird);
    }

    create3DBird(3.2, 4.3, 0.65, 0);
    create3DBird(3.7, 4.9, 0.55, 2.1);
    create3DBird(2.9, 3.7, 0.72, 4.2);
    create3DBird(4.0, 5.2, 0.48, 1.1);

    // =========================================================================
    // 6. AMBIENT GOLDEN FIREFLIES PARTICLE FIELD
    // =========================================================================
    const fireflyCount = 160;
    const fireflyGeo = new THREE.BufferGeometry();
    const fireflyPos = new Float32Array(fireflyCount * 3);

    for (let i = 0; i < fireflyCount; i++) {
      fireflyPos[i * 3] = (Math.random() - 0.5) * 14;
      fireflyPos[i * 3 + 1] = Math.random() * 8;
      fireflyPos[i * 3 + 2] = (Math.random() - 0.5) * 14;
    }
    fireflyGeo.setAttribute('position', new THREE.BufferAttribute(fireflyPos, 3));

    const fireflyMat = new THREE.PointsMaterial({
      color: 0xffea79,
      size: 0.08,
      transparent: true,
      opacity: 0.85
    });
    const fireflyPoints = new THREE.Points(fireflyGeo, fireflyMat);
    scene.add(fireflyPoints);

    // =========================================================================
    // 7. INTERACTIVE "MAKE A WISH" HANDLER & FULL-BLOOM FINALE
    // =========================================================================
    const wishBtn = document.getElementById('btn-make-wish');
    const wishCard = document.getElementById('wish-card');
    const wishStepLabel = document.getElementById('wish-step-label');
    const wishTextEl = document.getElementById('wish-text');
    const counterEl = document.getElementById('bloom-counter');

    wishBtn.addEventListener('click', () => {
      if (isTreeFullyBloomed) {
        // Shower extra golden petals on click after full bloom
        playBloomChime(7);
        branchCurves.forEach((curve, idx) => {
          const pt = curve.getPointAt(0.7 + Math.random() * 0.3);
          setTimeout(() => create3DFlower(pt, true), idx * 35);
        });
        return;
      }

      playBloomChime(currentWishIndex);

      // Slowly bloom flowers on the next empty branch
      bloomBranchCluster(currentWishIndex);

      // Update Wish Card UI
      wishCard.classList.remove('pop');
      void wishCard.offsetWidth;
      wishCard.classList.add('pop');

      wishStepLabel.textContent = `🌸 Wish ${currentWishIndex + 1} of ${wishes.length}`;
      wishTextEl.textContent = `“${wishes[currentWishIndex]}”`;

      currentWishIndex++;
      counterEl.textContent = `🌸 ${currentWishIndex} / ${wishes.length} Bloomed`;
      canopyGlowLight.intensity = 1.1 + currentWishIndex * 0.2;

      // Trigger Full-Bloom Finale once all 11 branches have bloomed
      if (currentWishIndex === wishes.length) {
        isTreeFullyBloomed = true;
        wishBtn.innerHTML = '<span>Shower Golden Petals ✨</span>';

        setTimeout(() => {
          playFinaleFanfare();
          canopyGlowLight.intensity = 3.6;

          // Fill out remaining canopy spaces with lush blossoms
          branchCurves.forEach((curve, bIdx) => {
            for (let k = 0; k < 3; k++) {
              const pt = curve.getPointAt(0.4 + Math.random() * 0.6);
              const offset = new THREE.Vector3(
                (Math.random() - 0.5) * 0.55,
                (Math.random() - 0.5) * 0.45,
                (Math.random() - 0.5) * 0.55
              );
              setTimeout(() => create3DFlower(pt.clone().add(offset), k % 2 === 0), (bIdx * 3 + k) * 30);
            }
          });

          wishCard.classList.remove('pop');
          void wishCard.offsetWidth;
          wishCard.classList.add('pop', 'finale');
          wishStepLabel.textContent = '✨ FULLY BLOOMED WISH TREE ✨';
          wishTextEl.textContent = finalTreeMessage;
        }, 1600);
      }
    });

    // =========================================================================
    // 8. 360° DRAG ROTATION, GENTLE SWAY & ANIMATION LOOP
    // =========================================================================
    let isDragging = false;
    let prevPointerX = 0;
    let targetRotationY = 0;

    container.addEventListener('pointerdown', (e) => {
      isDragging = true;
      prevPointerX = e.clientX;
    });

    window.addEventListener('pointermove', (e) => {
      if (!isDragging) return;
      const deltaX = e.clientX - prevPointerX;
      prevPointerX = e.clientX;
      targetRotationY += deltaX * 0.008;
    });

    window.addEventListener('pointerup', () => {
      isDragging = false;
    });

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    const clock = new THREE.Clock();

    function animate() {
      requestAnimationFrame(animate);
      const elapsed = clock.getElapsedTime();

      if (!isDragging) {
        targetRotationY += isTreeFullyBloomed ? 0.004 : 0.0018;
      }
      treeGroup.rotation.y += (targetRotationY - treeGroup.rotation.y) * 0.08;

      // Subtle breeze sway on branches & blossoms
      canopySwayGroup.rotation.z = Math.sin(elapsed * 1.15) * 0.028;
      canopySwayGroup.rotation.x = Math.cos(elapsed * 0.95) * 0.018;

      // Smooth spring scale-in animation for newly bloomed flowers
      for (const flower of activeFlowers) {
        if (flower.userData.currentScale < flower.userData.targetScale) {
          flower.userData.currentScale +=
            (flower.userData.targetScale - flower.userData.currentScale) * 0.09;
          const s = flower.userData.currentScale;
          flower.scale.set(s, s, s);
        }
      }

      // Update falling petals
      for (let i = fallingPetals.length - 1; i >= 0; i--) {
        const p = fallingPetals[i];
        p.position.x += p.userData.vx + Math.sin(elapsed * 2 + i) * 0.004;
        p.position.y += p.userData.vy;
        p.position.z += p.userData.vz;
        p.rotation.x += p.userData.rotSpeed;
        p.rotation.y += p.userData.rotSpeed;
        p.material.opacity -= 0.0035;

        if (p.material.opacity <= 0 || p.position.y < 0.05) {
          treeGroup.remove(p);
          p.geometry.dispose();
          p.material.dispose();
          fallingPetals.splice(i, 1);
        }
      }

      // Animate 3D Golden Birds orbiting the canopy
      const speedMult = isTreeFullyBloomed ? 1.4 : 1.0;
      for (const b of birds) {
        const d = b.userData;
        const angle = elapsed * d.speed * speedMult + d.phase;
        const nextAngle = angle + 0.05;

        const x = Math.cos(angle) * d.orbitRadius;
        const z = Math.sin(angle) * d.orbitRadius;
        const y = d.heightOffset + Math.sin(elapsed * 1.8 + d.phase) * 0.28;

        const nx = Math.cos(nextAngle) * d.orbitRadius;
        const nz = Math.sin(nextAngle) * d.orbitRadius;
        const ny = d.heightOffset + Math.sin((elapsed + 0.05) * 1.8 + d.phase) * 0.28;

        b.position.set(x, y, z);
        b.lookAt(nx, ny, nz);

        const flap = Math.sin(elapsed * d.flapSpeed) * 0.65;
        d.leftWingPivot.rotation.z = flap;
        d.rightWingPivot.rotation.z = -flap;
      }

      fireflyPoints.rotation.y = elapsed * 0.04;

      renderer.render(scene, camera);
    }

    animate();
  </script>
</body>
</html>
